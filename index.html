<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ゴルフコンペ組分け</title>
<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--bd:#dfe3e6;--tx:#1d2327;--mu:#667078;--bad:#c62828;--warn:#fff4e0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--tx);background:#f4f6f5;font-size:16px;line-height:1.5}
header{background:var(--g);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none}
h1{font-size:18px;margin:0}
h2{font-size:17px;margin:14px 0 6px}
h3{font-size:15px;margin:14px 0 4px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.card.link{display:block;color:inherit;text-decoration:none}
.card.pend{background:var(--warn);border-color:#f0c070}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-block;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:10px;padding:10px 14px;font-size:15px;min-height:44px;text-decoration:none;text-align:center;cursor:pointer}
.btn.pri{background:var(--g);color:#fff}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx)}
label.chk input{width:auto}
.muted{color:var(--mu);font-size:14px}
.note{background:#f6f7f8;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{flex:1;text-align:center;padding:12px 0;color:var(--mu);text-decoration:none;font-size:14px}
.tabs a.on{color:var(--g);font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #999;vertical-align:-1px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--g2);color:var(--g)}
.seg{display:flex;margin-top:8px}
.seg button{flex:1;border:1px solid var(--bd);background:#fff;padding:8px 4px;font-size:14px;cursor:pointer;color:var(--tx)}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button+button{border-left:0}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.seg.big button{padding:14px 4px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:20;max-width:90%;font-size:14px}
.err{color:var(--bad);font-size:14px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--g);font-size:15px;padding:6px 0}
.center{text-align:center;padding:40px 12px}
.mem{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin-top:6px;background:#fff;cursor:pointer}
.mem small{color:var(--mu)}
.mem.sel{outline:3px solid #f9a825;background:#fff8e1}
.mem.gone{opacity:.5;text-decoration:line-through}
.gcard{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.gcard.locked{background:#eef3ef}
.gcard.drop{border-color:#f9a825}
.warn{background:#fde8c8;color:#8a4b00}
table.pt{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.pt th:nth-child(1){width:13%}table.pt th:nth-child(2){width:11%}
table.pt th,table.pt td{border:1px solid #333;padding:6px 6px;text-align:left}
table.pt th{background:#eee}
@page{size:A4;margin:0}
@media print{body{padding:12mm 14mm!important}header,.tabs,.no-print,.toast{display:none!important}body{background:#fff}main{padding:0!important;max-width:none!important}table.pt{font-size:12pt}tr{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
/* ====== 設定 ====== */
const SB_URL = 'https://sotrrieijxizfpbsumti.supabase.co';
const SB_KEY = 'sb_publishable_4d1_-M6ozH-Ht3U2UrETuw_gCyhbUcS';
const TEE = {
  white: ['白', '#ffffff'], blue: ['青', '#1e66d0'], red: ['赤', '#d32f2f'],
  gold: ['金', '#e0a800'], black: ['黒', '#222222']
};

/* ====== ユーティリティ ====== */
const state = { sb: null, token: null, team: null, listening: false };
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* noop */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } }
};

function getTeams() {
  try { const a = JSON.parse(ls.get('golf_teams') || '[]'); return Array.isArray(a) ? a.filter((t) => t && t.token) : []; } catch (e) { return []; }
}
function setTeams(a) { ls.set('golf_teams', JSON.stringify(a)); }
function rememberTeam(token, name) {
  const a = getTeams(); const t = a.find((x) => x.token === token);
  if (t) t.name = name; else a.push({ token, name });
  setTeams(a);
}
async function fetchTeam(token) {
  try { const r = await makeClient(token).from('teams').select('*').maybeSingle(); return r.data || null; } catch (e) { return null; }
}
function switchTo(token) {
  ls.set('golf_token', token);
  history.replaceState(null, '', location.pathname + '#/events');
  init();
}
function tokenFromInput(v) {
  const m = v.trim().match(/[?&]t=([A-Za-z0-9]+)/) || (/^[A-Za-z0-9]{20,}$/.test(v.trim()) ? [null, v.trim()] : null);
  return m ? m[1] : null;
}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  let value;
  let hasValue = false;
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'value') { value = v; hasValue = true; }
    else if (k === 'checked') e.checked = true;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (hasValue) e.value = value;
  return e;
}
const mount = (node) => { document.getElementById('app').replaceChildren(node); };
const base = () => location.origin + location.pathname;
const toHira = (s) => s.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = (s) => toHira(String(s || '').toLowerCase()).replace(/[\s\u3000]+/g, '');
const noSpace = (s) => String(s || '').replace(/[\s\u3000]+/g, '');
const joinName = (l, f) => (noSpace(l) + ' ' + noSpace(f)).trim();
const kanaVal = (s) => toHira(noSpace(s));
const scoreOrNull = (v) => { const n = numOrNull(v); return n != null && n > 0 ? n : null; };
function nameInputs(last, first, lk, fk) {
  const mk = (v, ph) => el('input', { value: v || '', placeholder: ph, autocomplete: 'off' });
  const l = mk(last, '山田'); const f = mk(first, '太郎');
  const lkI = mk(lk, 'やまだ'); const fkI = mk(fk, 'たろう');
  const node = el('div', {},
    el('div', { class: 'row', style: 'flex-wrap:nowrap' },
      el('div', { class: 'grow' }, el('label', {}, '姓'), l),
      el('div', { class: 'grow' }, el('label', {}, '名'), f)),
    el('div', { class: 'row', style: 'flex-wrap:nowrap' },
      el('div', { class: 'grow' }, el('label', {}, '姓のよみ（ひらがな）'), lkI),
      el('div', { class: 'grow' }, el('label', {}, '名のよみ（ひらがな）'), fkI)));
  return { l, f, lk: lkI, fk: fkI, node };
}
const numOrNull = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
const strOrNull = (v) => { const s = String(v || '').trim(); return s ? s : null; };

function teeFromText(s) {
  if (!s) return null;
  const t = String(s).trim().toLowerCase();
  for (const [k, [l]] of Object.entries(TEE)) {
    if (t === k || t === l || t === l + 'ティー' || t === l + 'tee') return k;
  }
  return null;
}
function teeDot(k) {
  if (!k || !TEE[k]) return null;
  return el('span', { class: 'dot', title: TEE[k][0], style: 'background:' + TEE[k][1] });
}
function fmtDate(s) {
  if (!s) return '日付未定';
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${y}/${m}/${d}(${'日月火水木金土'[dt.getDay()]})`;
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const hhmm = (t) => (t ? String(t).slice(0, 5) : '');

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const t = el('div', { class: 'toast' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2400);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = el('textarea', { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('コピーしました');
}
function must(res) {
  if (res.error) throw res.error;
  return res.data;
}
function errMsg(e) {
  const m = (e && e.message) || String(e);
  const map = {
    form_closed: '出欠の受付は終了しています',
    form_not_found: 'URLが正しくありません',
    name_required: 'お名前を入力してください',
    invalid_score: '平均スコアは50〜200で入力してください（初めての方は0）',
    score_required: '平均スコアを入力してください（初めての方は0）',
    kana_required: '姓のよみ・名のよみを入力してください',
    rate_limited: '今日の読み取り回数の上限に達しました。明日また試すか、手で入力してください',
    read_failed: '読み取りに失敗しました。もう一度試すか、手で入力してください',
    player_not_found: '名簿の選択をやり直してください'
  };
  for (const k of Object.keys(map)) if (m.includes(k)) return map[k];
  return 'エラー：' + m;
}
async function guard(fn) {
  try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e)); }
}
function seg(options, current, onPick, big) {
  return el('div', { class: 'seg' + (big ? ' big' : '') },
    options.map(([v, label]) => el('button', {
      type: 'button',
      class: v === current ? 'on' : '',
      onclick: () => onPick(v)
    }, label)));
}
function makeClient(token) {
  return supabase.createClient(SB_URL, SB_KEY, {
    global: { headers: token ? { 'x-team-token': token } : {} },
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
}
function teeSelect(current) {
  return el('select', { value: current || '' },
    el('option', { value: '' }, '指定なし'),
    Object.entries(TEE).map(([k, [l]]) => el('option', { value: k }, l)));
}

async function fileToJpeg(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

/* ====== 起動 ====== */
async function init() {
  const q = new URLSearchParams(location.search);
  if (q.get('f')) return renderForm(q.get('f'));
  const t = q.get('t');
  if (t) {
    ls.set('golf_token', t);
    history.replaceState(null, '', location.pathname + location.hash);
  }
  state.token = ls.get('golf_token');
  if (!state.token) return renderWelcome();
  state.sb = makeClient(state.token);
  let team = null;
  try {
    const r = await state.sb.from('teams').select('*').maybeSingle();
    team = r.data;
  } catch (e) { team = null; }
  if (!team) {
    setTeams(getTeams().filter((t) => t.token !== state.token));
    ls.del('golf_token');
    const rest = getTeams();
    if (rest.length) { ls.set('golf_token', rest[0].token); return init(); }
    return renderWelcome('幹事用URLが正しくないか、チームが見つかりません');
  }
  state.team = team;
  rememberTeam(state.token, team.name);
  if (!state.listening) {
    state.listening = true;
    window.addEventListener('hashchange', routeAdmin);
  }
  routeAdmin();
}

function renderWelcome(errText) {
  const nameIn = el('input', { placeholder: '例：○○ゴルフ会 幹事チーム' });
  const urlIn = el('input', { placeholder: '幹事用URLを貼り付け' });
  mount(el('div', {},
    el('header', {}, el('h1', {}, '⛳ ゴルフコンペ組分け')),
    el('main', {},
      errText && el('p', { class: 'err' }, errText),
      el('div', { class: 'card' },
        el('h2', {}, '新しく始める'),
        el('p', { class: 'muted' }, '幹事のみんなで共有するチームを作ります。作成後に出る「幹事用URL」を他の幹事に送ると、同じデータを見られます。'),
        el('label', {}, 'チーム名'), nameIn,
        el('p', {}, el('button', {
          class: 'btn pri block', onclick: () => guard(async () => {
            const r = must(await makeClient(null).rpc('create_team', { p_name: nameIn.value }));
            const row = Array.isArray(r) ? r[0] : r;
            ls.set('golf_token', row.admin_token);
            location.hash = '#/settings';
            init();
          })
        }, 'チームを作る'))),
      el('div', { class: 'card' },
        el('h2', {}, '幹事用URLを持っている'),
        urlIn,
        el('p', {}, el('button', {
          class: 'btn block', onclick: () => {
            const v = urlIn.value.trim();
            const m = v.match(/[?&]t=([A-Za-z0-9]+)/) || (/^[A-Za-z0-9]{20,}$/.test(v) ? [null, v] : null);
            if (!m) return toast('URLを確認してください');
            ls.set('golf_token', m[1]);
            init();
          }
        }, '開く'))))));
}

/* ====== 幹事画面：ルーティング ====== */
function shell(active, content) {
  const tab = (id, label, href) => el('a', { href, class: active === id ? 'on' : '' }, label);
  return el('div', {},
    el('header', {}, el('h1', {}, el('a', { href: '#/teams' }, '⛳ ' + (state.team ? state.team.name : '組分け') + ' ▾'))),
    el('main', {}, content),
    el('nav', { class: 'tabs' },
      tab('events', '📅 コンペ', '#/events'),
      tab('players', '👥 名簿', '#/players'),
      tab('settings', '⚙ 設定', '#/settings')));
}

async function routeAdmin() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'events').split('/');
  let active = 'events';
  let view;
  const [a, b, c] = parts;
  if (a === 'events') view = viewEvents;
  else if (a === 'event' && b === 'new') view = () => viewEventForm(null);
  else if (a === 'event' && c === 'edit') view = () => viewEventForm(b);
  else if (a === 'event' && c === 'groups') view = () => viewGroups(b);
  else if (a === 'event' && c === 'print') view = () => viewPrint(b);
  else if (a === 'event' && c === 'special') view = () => viewSpecial(b);
  else if (a === 'event' && c === 'collect') view = () => viewCollect(b);
  else if (a === 'event' && c === 'results') view = () => viewResults(b);
  else if (a === 'event' && c === 'awards') view = () => viewAwards(b);
  else if (a === 'event' && b) view = () => viewEvent(b);
  else if (a === 'players' && b === 'import') { active = 'players'; view = viewImport; }
  else if (a === 'players') { active = 'players'; view = viewPlayers; }
  else if (a === 'player') { active = 'players'; view = () => viewPlayerForm(b === 'new' ? null : b); }
  else if (a === 'teams') { active = 'settings'; view = viewTeams; }
  else if (a === 'settings') { active = 'settings'; view = viewSettings; }
  else view = viewEvents;
  try {
    const content = await view();
    mount(shell(active, content));
  } catch (e) {
    console.error(e);
    mount(shell(active, el('p', { class: 'err' }, errMsg(e))));
  }
}
async function refresh() {
  const y = window.scrollY;
  await routeAdmin();
  window.scrollTo(0, y);
}

/* ====== コンペ一覧・作成 ====== */
async function viewEvents() {
  const evs = must(await state.sb.from('events').select('*')
    .order('event_date', { ascending: false, nullsFirst: true }));
  return [
    el('div', { class: 'row between' },
      el('h2', {}, 'コンペ'),
      el('a', { class: 'btn pri', href: '#/event/new' }, '＋ 新規作成')),
    evs.length
      ? evs.map((e) => el('a', { class: 'card link', href: '#/event/' + e.id },
        el('strong', {}, e.name),
        el('div', { class: 'muted' }, fmtDate(e.event_date) + (e.course_name ? ' ・ ' + e.course_name : ''))))
      : el('p', { class: 'muted' }, 'まだコンペがありません。「新規作成」から始めましょう。')
  ];
}

async function viewEventForm(id) {
  const ev = id
    ? must(await state.sb.from('events').select('*').eq('id', id).single())
    : { name: '', event_date: '', course_name: '', group_count_hint: '', has_party: false, form_deadline: null, fee_per_person: '', compe_fee: '', includes: '', payment_note: 'スタート前に現金で受付へ', playfee_by_self: true, small_group_fee: '', cancel_policy: '', notes_admin: '', notes_line: '' };
  const name = el('input', { value: ev.name, placeholder: '例：第12回 秋季コンペ' });
  const date = el('input', { type: 'date', value: ev.event_date || '' });
  const course = el('input', { value: ev.course_name || '', placeholder: 'ゴルフ場名' });
  const groups = el('input', { type: 'number', inputmode: 'numeric', value: ev.group_count_hint ?? '', placeholder: '空欄でOK' });
  const fee = el('input', { type: 'number', inputmode: 'numeric', value: ev.fee_per_person ?? '', placeholder: '例：10750' });
  const compeFee = el('input', { type: 'number', inputmode: 'numeric', value: ev.compe_fee ?? '', placeholder: '例：4250（なければ空欄）' });
  const totalView = el('div', { class: 'muted' });
  const showTotal = () => {
    const a = numOrNull(fee.value) || 0, c = numOrNull(compeFee.value) || 0;
    totalView.textContent = (a || c) ? `1人の参加費の合計：${(a + c).toLocaleString('ja-JP')}円` : '';
  };
  fee.addEventListener('input', showTotal); compeFee.addEventListener('input', showTotal); showTotal();
  const includes = el('input', { value: ev.includes || '', placeholder: '例：昼食付・セルフ・乗用カート' });
  const payNote = el('input', { value: ev.payment_note || '', placeholder: '例：スタート前に現金で受付へ' });
  const playBy = el('select', { value: ev.playfee_by_self === false ? 'organizer' : 'self' },
    el('option', { value: 'self' }, '各自がゴルフ場で精算'),
    el('option', { value: 'organizer' }, '幹事がまとめて集金'));
  const PAY_SELF = 'スタート前に現金で受付へ', PAY_ORG = '受付で現金で集金';
  playBy.addEventListener('change', () => {
    const v = payNote.value.trim();
    if (playBy.value === 'organizer' && (!v || v === PAY_SELF)) payNote.value = PAY_ORG;
    else if (playBy.value === 'self' && (!v || v === PAY_ORG)) payNote.value = PAY_SELF;
  });
  const smallFee = el('input', { type: 'number', inputmode: 'numeric', value: ev.small_group_fee ?? '', placeholder: '例：3300（1組2名のとき1人あたりの追加）' });
  const cancel = el('textarea', { value: ev.cancel_policy || '', placeholder: '例：土日祝は1週間前から1人5,000円、平日は3日前から1人3,000円' });
  const notesAdmin = el('textarea', { value: ev.notes_admin || '', placeholder: '幹事だけが見るメモ（ゴルフ場の注意事項、クーポンURLなど）' });
  let pendingSlots = null;
  const slotInfo = el('div', { class: 'muted' });
  const candBox = el('div', {});
  const readMsg = el('div', { class: 'muted' });
  const fileIn = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
  const readBtn = el('button', { class: 'btn block', type: 'button', onclick: () => fileIn.click() }, '📷 予約画面のスクショから読み取る');
  const notesLine = el('textarea', { value: ev.notes_line || '', placeholder: '出欠のLINE案内文に入れる注意事項（例：支払いはクレジットのみ／セルフバッグ持込禁止）' });
  const party = el('input', { type: 'checkbox', checked: ev.has_party });
  const deadline = el('input', { type: 'datetime-local', value: toLocalInput(ev.form_deadline) });
  function applyBooking(d) {
    const fill = (input, v) => { if (v != null && v !== '') input.value = v; };
    if (!name.value.trim() && d.course_name) name.value = d.course_name + 'コンペ';
    fill(date, d.event_date); fill(course, d.course_name); fill(includes, d.includes);
    fill(fee, d.fee_per_person); showTotal(); fill(smallFee, d.small_group_fee); fill(cancel, d.cancel_policy);
    fill(notesAdmin, d.notes_admin); fill(groups, d.group_count);
    const seen = new Set();
    pendingSlots = (d.slots || [])
      .filter((x) => x && /^\d{1,2}:\d{2}$/.test(x.time) && (x.course === 'IN' || x.course === 'OUT'))
      .map((x) => ({ course: x.course, time: x.time.padStart(5, '0') }))
      .filter((x) => { const k = x.course + x.time; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => a.time.localeCompare(b.time) || (a.course === b.course ? 0 : a.course === 'OUT' ? -1 : 1));
    slotInfo.textContent = pendingSlots.length ? `スタート枠：${pendingSlots.length}枠を読み取りました（保存すると登録されます）` : '';
    const cands = (d.line_candidates || []).slice(0, 8);
    candBox.replaceChildren(...(cands.length ? [el('div', { class: 'muted', style: 'margin-top:6px' }, '読み取った注意事項。LINEの案内文に入れるものにチェック：')] : []),
      ...cands.map((t) => {
        const cb = el('input', { type: 'checkbox' });
        cb.addEventListener('change', () => {
          const lines = notesLine.value.split('\n').filter((l) => l.trim() && l !== t);
          if (cb.checked) lines.push(t);
          notesLine.value = lines.join('\n');
        });
        return el('label', { class: 'chk' }, cb, t);
      }));
  }
  fileIn.addEventListener('change', () => guard(async () => {
    const files = [...fileIn.files].slice(0, 8);
    if (!files.length) return;
    if (fileIn.files.length > 8) toast('8枚までです。先頭の8枚を読み取ります');
    readBtn.disabled = true;
    readMsg.textContent = '読み取り中…（20〜40秒ほどかかります）';
    try {
      const images = await Promise.all(files.map((f) => fileToJpeg(f)));
      const r = await fetch(`${SB_URL}/functions/v1/read-booking`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-team-token': state.token, apikey: SB_KEY },
        body: JSON.stringify({ images })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error === 'rate_limited' ? 'rate_limited' : 'read_failed');
      applyBooking(j.data);
      readMsg.textContent = '読み取りました。内容を確認して、違うところは直してください。';
    } catch (e) {
      readMsg.textContent = '';
      throw e;
    } finally {
      readBtn.disabled = false;
      fileIn.value = '';
    }
  }));
  return [
    el('h2', {}, id ? 'コンペを編集' : '新しいコンペ'),
    el('div', { class: 'card' },
      !id && el('div', {}, readBtn, readMsg, slotInfo, fileIn,
        el('p', { class: 'muted' }, '予約確認画面のスクショを何枚でも選べます（8枚まで）。読み取った内容は入力欄に入るだけで、保存は「保存」を押したときです。')),
      el('label', {}, 'コンペ名'), name,
      el('label', {}, '開催日'), date,
      el('label', {}, 'ゴルフ場'), course,
      el('label', {}, '組数の目安'), groups,
      el('label', {}, 'プレーフィー（1人あたり・円）'), fee,
      el('label', {}, 'コンペ費（1人あたり・円）'), compeFee, totalView,
      el('label', {}, '料金に含まれるもの'), includes,
      el('label', {}, 'プレーフィーの支払い'), playBy,
      el('label', {}, '幹事が集めるお金の集金方法'), payNote,
      el('label', {}, '1組2名のときの追加料金（円・1人あたり）'), smallFee,
      el('label', {}, 'キャンセル規定'), cancel,
      el('label', {}, '特記事項（幹事用）'), notesAdmin,
      el('label', {}, '特記事項（LINEの案内文に入れる）'), notesLine, candBox,
      el('label', { class: 'chk' }, party, '表彰式・打上げあり（出欠フォームで参加可否を聞く）'),
      el('label', {}, '出欠の締切（空欄なら締切なし）'), deadline,
      el('p', { class: 'muted' }, 'スタート時間の枠は、コンペを作ったあとに、コンペ画面で登録します。ニアピン・ドラコンのホールは当日に入力できるようにします（後のステップで追加）。')),
    el('button', {
      class: 'btn pri block', onclick: () => guard(async () => {
        if (!name.value.trim()) return toast('コンペ名を入力してください');
        const payload = {
          name: name.value.trim(),
          event_date: date.value || null,
          course_name: strOrNull(course.value),
          group_count_hint: numOrNull(groups.value),
          compe_fee: numOrNull(compeFee.value),
          includes: strOrNull(includes.value),
          payment_note: strOrNull(payNote.value),
          playfee_by_self: playBy.value === 'self',
          fee_per_person: numOrNull(fee.value),
          small_group_fee: numOrNull(smallFee.value),
          cancel_policy: strOrNull(cancel.value),
          notes_admin: strOrNull(notesAdmin.value),
          notes_line: strOrNull(notesLine.value),
          has_party: party.checked,
          form_deadline: deadline.value ? new Date(deadline.value).toISOString() : null
        };
        if (id) {
          must(await state.sb.from('events').update(payload).eq('id', id));
          location.hash = '#/event/' + id;
        } else {
          payload.team_id = state.team.id;
          const row = must(await state.sb.from('events').insert(payload).select().single());
          if (pendingSlots && pendingSlots.length) {
            must(await state.sb.from('groups').insert(pendingSlots.map((x, i) => ({
              event_id: row.id, group_no: i + 1, start_time: x.time, start_course: x.course }))));
          }
          location.hash = '#/event/' + row.id;
        }
      })
    }, '保存'),
    el('p', {}, el('a', { class: 'btn block', href: id ? '#/event/' + id : '#/events' }, 'キャンセル')),
    id && el('p', {}, el('button', {
      class: 'btn bad block', onclick: () => guard(async () => {
        if (!confirm('このコンペと出欠データを削除します。よろしいですか？')) return;
        must(await state.sb.from('events').delete().eq('id', id));
        location.hash = '#/events';
      })
    }, 'このコンペを削除'))
  ];
}

/* ====== コンペ詳細（出欠管理） ====== */
async function viewEvent(id) {
  const sb = state.sb;
  const [evR, enR, plR, grR] = await Promise.all([
    sb.from('events').select('*').eq('id', id).single(),
    sb.from('entries').select('*').eq('event_id', id).order('created_at'),
    sb.from('players').select('*').order('kana', { ascending: true, nullsFirst: false }).order('name'),
    sb.from('groups').select('*').eq('event_id', id).order('start_time').order('start_course')
  ]);
  const ev = must(evR);
  const slots = must(grR);
  const entries = must(enR);
  const players = must(plR);
  const pById = new Map(players.map((p) => [p.id, p]));
  const eff = (e) => {
    const p = pById.get(e.player_id) || {};
    return { aff: e.affiliation ?? p.affiliation, avg: e.avg_score ?? p.avg_score, tee: e.tee ?? p.tee };
  };
  const approved = entries.filter((e) => e.approval === 'approved');
  const pending = entries.filter((e) => e.approval === 'pending');
  const joined = approved.filter((e) => e.attendance === 'join');
  const absent = approved.filter((e) => e.attendance === 'absent');
  const cancelled = approved.filter((e) => e.attendance === 'cancelled');
  const answeredIds = new Set(entries.map((e) => e.player_id).filter(Boolean));
  const unanswered = players.filter((p) => !answeredIds.has(p.id));
  const partyJoin = joined.filter((e) => e.party === 'join').length;
  const formUrl = `${base()}?f=${ev.form_token}`;
  const closed = !ev.form_open || (ev.form_deadline && new Date(ev.form_deadline) <= new Date());

  const setAtt = (e, v) => guard(async () => {
    must(await sb.from('entries').update({ attendance: v }).eq('id', e.id));
    if (v !== 'join') await sb.from('group_members').delete().eq('entry_id', e.id);
    refresh();
  });
  const setParty = (e, v) => guard(async () => {
    must(await sb.from('entries').update({ party: v || null }).eq('id', e.id));
    refresh();
  });
  const delEntry = (e) => guard(async () => {
    if (!confirm(`${e.name}さんの出欠を削除しますか？`)) return;
    must(await sb.from('entries').delete().eq('id', e.id));
    refresh();
  });
  const addEntry = (p, attendance) => guard(async () => {
    must(await sb.from('entries').insert({
      event_id: id, player_id: p.id, name: p.name, last_name: p.last_name, first_name: p.first_name, last_kana: p.last_kana, first_kana: p.first_kana, attendance, approval: 'approved', source: 'admin'
    }));
    refresh();
  });

  const entryRow = (e) => {
    const f = eff(e);
    return el('div', { class: 'card' },
      el('div', { class: 'row between' },
        el('div', {}, el('strong', {}, e.name), ' ', teeDot(f.tee), ' ',
          e.source === 'form' && el('span', { class: 'badge' }, '本人回答')),
        el('button', { class: 'btn sm bad', onclick: () => delEntry(e) }, '削除')),
      el('div', { class: 'muted' }, [f.aff, f.avg != null ? `平均${f.avg}` : '平均未入力'].filter(Boolean).join(' ・ ')),
      e.note && el('div', { class: 'note' }, '💬 ' + e.note),
      seg([['join', '参加'], ['absent', '欠席'], ['cancelled', '当日キャンセル']], e.attendance, (v) => setAtt(e, v)),
      ev.has_party && seg([['join', '打上げ○'], ['absent', '打上げ×'], ['', '未回答']], e.party || '', (v) => setParty(e, v)));
  };

  const pendingCard = (e) => el('div', { class: 'card pend' },
    el('strong', {}, e.name), ' ', el('span', { class: 'badge' }, '名簿にない人'),
    el('div', { class: 'muted' }, [
      (e.last_kana || e.first_kana) ? 'よみ：' + (e.last_kana || '') + (e.first_kana || '') : null,
      e.affiliation, e.avg_score != null ? `平均${e.avg_score}` : null,
      e.tee ? 'ティー' + TEE[e.tee][0] : null,
      '回答：' + (e.attendance === 'join' ? '参加' : '欠席'),
      ev.has_party && e.attendance === 'join' ? '打上げ：' + ({ join: '参加', absent: '欠席' }[e.party] || '未回答') : null
    ].filter(Boolean).join(' ・ ')),
    e.note && el('div', { class: 'note' }, '💬 ' + e.note),
    el('div', { class: 'row', style: 'margin-top:8px' },
      el('button', {
        class: 'btn sm pri', onclick: () => guard(async () => {
          must(await sb.rpc('approve_entry', { p_entry_id: e.id }));
          toast('名簿に追加しました');
          refresh();
        })
      }, '名簿に追加して承認'),
      el('button', { class: 'btn sm bad', onclick: () => delEntry(e) }, '却下')));

  const unansweredCard = unanswered.length ? el('div', { class: 'card' },
    el('div', { class: 'row between' },
      el('strong', {}, `未回答（名簿の ${unanswered.length}人）`),
      el('button', {
        class: 'btn sm', onclick: () => copyText('【未回答の方】\n' + unanswered.map((p) => p.name).join('\n'))
      }, '名前をコピー')),
    unanswered.map((p) => el('div', { class: 'row between', style: 'padding:6px 0;border-top:1px solid var(--bd);margin-top:6px' },
      el('div', { class: 'grow' }, p.name, ' ', teeDot(p.tee), el('span', { class: 'muted' }, p.affiliation ? '　' + p.affiliation : '')),
      el('button', { class: 'btn sm', onclick: () => addEntry(p, 'join') }, '参加'),
      el('button', { class: 'btn sm', onclick: () => addEntry(p, 'absent') }, '欠席')))) : null;

  // 名簿にない人を幹事が追加
  const nm2 = nameInputs('', '', '', '');
  const nAff = el('input', { placeholder: '所属（任意）' });
  const nAvg = el('input', { type: 'number', inputmode: 'numeric', placeholder: '平均スコア（任意）' });
  const nTee = teeSelect('');
  const addNew = el('details', {},
    el('summary', {}, '＋ 名簿にない人を追加する'),
    el('div', { class: 'card' },
      nm2.node,
      el('label', {}, '所属'), nAff,
      el('label', {}, '平均スコア'), nAvg,
      el('label', {}, 'ティー'), nTee,
      el('p', {}, el('button', {
        class: 'btn pri block', onclick: () => guard(async () => {
          if (!noSpace(nm2.l.value) || !noSpace(nm2.f.value)) return toast('姓と名を入力してください');
          const p = must(await sb.from('players').insert({
            team_id: state.team.id, last_name: noSpace(nm2.l.value), first_name: noSpace(nm2.f.value),
            name: joinName(nm2.l.value, nm2.f.value), last_kana: kanaVal(nm2.lk.value) || null, first_kana: kanaVal(nm2.fk.value),
            affiliation: strOrNull(nAff.value),
            avg_score: scoreOrNull(nAvg.value), tee: nTee.value || null
          }).select().single());
          must(await sb.from('entries').insert({
            event_id: id, player_id: p.id, name: p.name, last_name: p.last_name, first_name: p.first_name, last_kana: p.last_kana, first_kana: p.first_kana, attendance: 'join', approval: 'approved', source: 'admin'
          }));
          toast('名簿と出欠に追加しました');
          refresh();
        })
      }, '名簿に追加して参加にする'))));

  const noZero = (t) => String(t).replace(/^0/, '');
  const times = slots.map((g) => hhmm(g.start_time)).filter(Boolean).sort();
  const totalFee = (ev.fee_per_person || 0) + (ev.compe_fee || 0);
  const num = (n) => Number(n).toLocaleString('ja-JP');
  const bySelfL = ev.playfee_by_self !== false;
  const hasPlay = ev.fee_per_person != null, hasCompe = ev.compe_fee != null;
  const feeLines = [];
  if (hasPlay && hasCompe && !bySelfL) {
    feeLines.push(`参加費：${num(totalFee)}円（プレーフィー＋コンペ費合計）`);
    if (ev.payment_note) feeLines.push('お支払い：' + ev.payment_note);
  } else {
    if (hasCompe) feeLines.push(`コンペ費：${num(ev.compe_fee)}円` + (ev.payment_note ? `（${ev.payment_note}）` : ''));
    if (hasPlay) feeLines.push(bySelfL ? `プレーフィー：${num(ev.fee_per_person)}円（各自ゴルフ場で精算）`
      : `参加費：${num(ev.fee_per_person)}円` + (ev.payment_note ? `（${ev.payment_note}）` : ''));
  }
  const lineText = [
    `【${ev.name}】`,
    fmtDate(ev.event_date) + (ev.course_name ? ' ' + ev.course_name : ''),
    times.length ? `スタート：${noZero(times[0])}〜${noZero(times[times.length - 1])}（組は後日お知らせ）` : null,
    ...feeLines,
    ev.includes ? '料金に含まれるもの：' + ev.includes : null,
    '',
    '出欠のご回答をお願いします🙏',
    formUrl,
    ev.form_deadline ? '締切：' + fmtDateTime(ev.form_deadline) : null,
    ev.notes_line ? '\n' + ev.notes_line : null
  ].filter((x) => x !== null && x !== undefined).join('\n');

  // ---- 予約内容 ----
  const yen = (n) => '¥' + Number(n).toLocaleString('ja-JP');
  const total = (ev.fee_per_person || 0) + (ev.compe_fee || 0);
  const bySelf = ev.playfee_by_self !== false;
  const infoLines = [
    ev.fee_per_person != null ? `プレーフィー：${yen(ev.fee_per_person)}（${bySelf ? '各自ゴルフ場で精算' : '幹事がまとめて集金'}）`
      + (ev.small_group_fee ? `／1組2名のときは +${yen(ev.small_group_fee)}` : '') : null,
    ev.compe_fee != null ? `コンペ費：${yen(ev.compe_fee)}（幹事が集金）` : null,
    (ev.fee_per_person != null && ev.compe_fee != null && !bySelf) ? `幹事に払う合計：${yen(total)}` : null,
    ev.includes ? '含まれるもの：' + ev.includes : null,
    ev.payment_note ? '集金方法：' + ev.payment_note : null
  ].filter(Boolean);
  const infoCard = (infoLines.length || ev.cancel_policy || ev.notes_admin || ev.notes_line) ? el('div', { class: 'card' },
    el('strong', {}, 'ゴルフ場の予約内容'),
    infoLines.map((t) => el('div', { class: 'muted' }, t)),
    ev.cancel_policy && el('div', { class: 'note' }, 'キャンセル：' + ev.cancel_policy),
    ev.notes_admin && el('div', { class: 'note', style: 'white-space:pre-wrap' }, '幹事メモ：' + ev.notes_admin),
    ev.notes_line && el('div', { class: 'note', style: 'white-space:pre-wrap' }, 'LINE案内に入る注意：' + ev.notes_line)) : null;

  // ---- スタート枠 ----
  const pad2 = (n) => String(n).padStart(2, '0');
  const courseOf = (t) => (/^(out|アウト)/i.test(t) ? 'OUT' : 'IN');
  function parseSlots(text) {
    const out = [];
    for (const line of text.split(/\r?\n/)) {
      const m = line.match(/(IN|OUT|イン|アウト)\D*?(\d{1,2})\s*[:：]\s*(\d{2})/i);
      if (m) out.push({ course: courseOf(m[1]), time: `${pad2(m[2])}:${m[3]}` });
    }
    out.sort((a, b) => a.time.localeCompare(b.time) || (a.course === b.course ? 0 : a.course === 'OUT' ? -1 : 1));
    return out;
  }
  const slotText = el('textarea', { style: 'min-height:120px', placeholder: '1行に1枠。例：\nINコース 08:37\nOUTコース 08:37\nIN 08:45' });
  const gStart = el('input', { type: 'time' });
  const gPattern = el('input', { value: '8,7', placeholder: '8,7（この間隔を繰り返す）' });
  const gCount = el('input', { type: 'number', inputmode: 'numeric', value: '8' });
  const gCourse = el('select', { value: 'both' }, el('option', { value: 'both' }, 'IN・OUTの両方'), el('option', { value: 'IN' }, 'INのみ'), el('option', { value: 'OUT' }, 'OUTのみ'));
  const slotRow = (g) => {
    const t = el('input', { type: 'time', value: hhmm(g.start_time), style: 'width:auto' });
    const c = el('select', { value: g.start_course || 'IN', style: 'width:auto' }, el('option', { value: 'OUT' }, 'OUT'), el('option', { value: 'IN' }, 'IN'));
    const save = () => guard(async () => {
      must(await sb.from('groups').update({ start_time: t.value || null, start_course: c.value }).eq('id', g.id));
      toast('保存しました');
    });
    t.addEventListener('change', save); c.addEventListener('change', save);
    return el('div', { class: 'row', style: 'padding:4px 0;border-top:1px solid var(--bd);margin-top:4px' },
      el('span', { class: 'muted', style: 'width:2.5em' }, g.group_no + '組'), t, c,
      el('button', { class: 'btn sm bad', onclick: () => guard(async () => {
        must(await sb.from('groups').delete().eq('id', g.id));
        refresh();
      }) }, '削除'));
  };
  const slotsCard = el('div', { class: 'card' },
    el('div', { class: 'row between' },
      el('strong', {}, `スタート枠（${slots.length}組）`),
      el('span', { class: 'muted' }, slots.length ? `最大${slots.length * 4}名` : '未登録')),
    slots.length > 0 && el('div', { style: 'margin-top:6px' }, slots.map(slotRow)),
    el('details', { open: slots.length === 0 },
      el('summary', {}, slots.length ? '枠を作り直す・追加する' : '枠を登録する'),
      el('label', {}, '予約画面の時間を貼り付け（IN/OUTと時刻の行だけ拾います）'), slotText,
      el('details', {},
        el('summary', {}, '間隔から文章を作る（7分・8分の交互など）'),
        el('div', { class: 'row', style: 'flex-wrap:nowrap' },
          el('div', { class: 'grow' }, el('label', {}, '最初の時刻'), gStart),
          el('div', { class: 'grow' }, el('label', {}, '枠数（各コース）'), gCount)),
        el('label', {}, '間隔（分）をカンマ区切りで。順番に繰り返します'), gPattern,
        el('label', {}, 'コース'), gCourse,
        el('p', {}, el('button', { class: 'btn sm', onclick: () => {
          if (!gStart.value) return toast('最初の時刻を入れてください');
          const pat = gPattern.value.split(/[,，、\s]+/).map((x) => parseInt(x, 10)).filter((n) => n > 0);
          if (!pat.length) return toast('間隔を入れてください（例：8,7）');
          const n = Math.min(Math.max(numOrNull(gCount.value) || 1, 1), 40);
          let [h, m] = gStart.value.split(':').map(Number);
          let mins = h * 60 + m;
          const lines = [];
          for (let i = 0; i < n; i++) {
            const tm = `${pad2(Math.floor(mins / 60))}:${pad2(mins % 60)}`;
            if (gCourse.value !== 'IN') lines.push('OUTコース ' + tm);
            if (gCourse.value !== 'OUT') lines.push('INコース ' + tm);
            mins += pat[i % pat.length];
          }
          slotText.value = lines.join('\n');
        } }, '文章を作る'))),
      el('p', {}, el('button', { class: 'btn pri block', onclick: () => guard(async () => {

  return [
    el('div', { class: 'row between' },
      el('div', {},
        el('h2', { style: 'margin-bottom:0' }, ev.name),
        el('div', { class: 'muted' }, fmtDate(ev.event_date) + (ev.course_name ? ' ・ ' + ev.course_name : ''))),

      el('div', {}, el('b', {}, absent.length + cancelled.length), el('span', {}, '欠席')),

        : el('div', {}, el('b', {}, pending.length), el('span', {}, '承認待ち'))),
    el('a', { class: 'btn pri block', style: 'margin-top:10px', href: `#/event/${id}/groups` }, `👥 組分けする（参加${joined.length}人・枠${slots.length}組）`),
    el('a', { class: 'btn block', style: 'margin-top:8px', href: `#/event/${id}/special` }, '🎯 ニアピン・ドラコン'),
    el('a', { class: 'btn block', style: 'margin-top:8px', href: `#/event/${id}/collect` }, '💴 集金チェック'),
    el('a', { class: 'btn block', style: 'margin-top:8px', href: `#/event/${id}/results` }, '📊 成績・順位'),
    el('a', { class: 'btn block', style: 'margin-top:8px', href: `#/event/${id}/awards` }, '🎁 賞・商品'),
    infoCard,
    slotsCard,
    el('div', { class: 'card' },
      el('div', { class: 'row between' },
        el('strong', {}, '出欠フォーム'),
        el('span', { class: 'badge', style: closed ? 'background:#fde8e8;color:#c62828' : '' }, closed ? '受付終了' : '受付中')),
      el('input', { value: formUrl, readonly: true, style: 'margin-top:8px', onclick: (e) => e.target.select() }),
      ev.form_deadline && el('div', { class: 'muted' }, '締切：' + fmtDateTime(ev.form_deadline)),
      el('div', { class: 'row', style: 'margin-top:8px' },
        el('button', { class: 'btn sm pri', onclick: () => copyText(lineText) }, 'LINE用の案内文をコピー'),
        el('button', { class: 'btn sm', onclick: () => copyText(formUrl) }, 'URLだけコピー'),

    pending.length > 0 && el('h3', {}, `承認待ち（${pending.length}）`),

async function viewPlayers() {
  const players = must(await state.sb.from('players').select('*')
    .order('kana', { ascending: true, nullsFirst: false }).order('name'));
  const search = el('input', { type: 'search', placeholder: '名前・ふりがな・所属で検索' });
  const list = el('div', {});
  const draw = () => {
    const q = norm(search.value.trim());
    const f = players.filter((p) => !q || norm(p.name + (p.kana || '') + (p.affiliation || '')).includes(q));
    list.replaceChildren(...(f.length ? f.map((p) => el('a', { class: 'card link', href: '#/player/' + p.id },
      el('div', { class: 'row between' },
        el('div', {}, el('strong', {}, p.name), ' ', teeDot(p.tee),
          p.kana && el('span', { class: 'muted' }, '　' + p.kana)),
        el('span', { class: 'muted' }, p.avg_score != null ? `平均${p.avg_score}` : '')),
      p.affiliation && el('div', { class: 'muted' }, p.affiliation)))
      : [el('p', { class: 'muted' }, players.length ? '該当する人がいません' : 'まだ名簿がありません')]));
  };
  search.addEventListener('input', draw);
  draw();
  // 他のチームの名簿をコピー（この端末で開いたことのあるチームから）
  const others = getTeams().filter((t) => t.token !== state.token);
  const srcSel = el('select', {}, ...others.map((t) => el('option', { value: t.token }, t.name || 'チーム')));
  const copyCard = others.length ? el('details', { class: 'card' },
    el('summary', {}, '他のチームの名簿をコピーする'),
    el('p', { class: 'muted' }, '選んだチームの名簿から、このチームにまだいない人だけを追加します（名前が同じ人は飛ばします）。コピーしたあとは別々の名簿になります。新しい人が増えたら、もう一度コピーできます。'),
    srcSel,
    el('p', {}, el('button', { class: 'btn block', onclick: () => guard(async () => {
      const src = must(await makeClient(srcSel.value).from('players').select('*'));
      if (!src.length) return toast('コピー元の名簿が空です（URLが古い可能性があります）');
      const have = new Set(players.map((p) => norm(p.name)));
      const rows = src.filter((p) => !have.has(norm(p.name))).map((p) => ({
        team_id: state.team.id, last_name: p.last_name, first_name: p.first_name, last_kana: p.last_kana, first_kana: p.first_kana,
        avg_score: p.avg_score, affiliation: p.affiliation, tee: p.tee, note: p.note
      }));
      if (!rows.length) return toast('新しくコピーする人はいません');
      if (!confirm(`${rows.length}人をこのチームの名簿に追加します（${src.length - rows.length}人は登録済みのため飛ばします）。よろしいですか？`)) return;
      for (let i = 0; i < rows.length; i += 100) must(await state.sb.from('players').insert(rows.slice(i, i + 100)));
      toast(`${rows.length}人をコピーしました`);
      routeAdmin();
    }) }, 'コピーする'))) : null;
  return [
    el('div', { class: 'row between' },
      el('h2', {}, `名簿（${players.length}人）`),
      el('div', { class: 'row' },
        el('a', { class: 'btn sm', href: '#/players/import' }, 'まとめて追加'),
        el('a', { class: 'btn sm pri', href: '#/player/new' }, '＋ 追加'))),
    copyCard, search, list
  ];
}

async function viewImport() {
  const ta = el('textarea', {
    style: 'min-height:200px',
    placeholder: '1行に1人。カンマまたはタブ区切り\n姓,名,姓のよみ,名のよみ,平均スコア,所属,ティー\n山田,太郎,やまだ,たろう,98,A商事,青\n佐藤,花子,さとう,はなこ,105,B工業,赤'
  });
  return [
    el('h2', {}, '名簿をまとめて追加'),
    el('p', { class: 'muted' }, 'Excelからコピーして貼り付けてもOK。姓と名は必須、よみ・平均スコア・所属・ティーは省略できます（順番はそのまま。平均スコアが不明なら空欄か0）。すでに名簿にある同じ姓名の人は飛ばします。'),
    ta,
    el('p', {}, el('button', {
      class: 'btn pri block', onclick: () => guard(async () => {
        const existing = must(await state.sb.from('players').select('name'));
        const seen = new Set(existing.map((p) => noSpace(p.name).toLowerCase()));
        const rows = [];
        let skipped = 0;
        let bad = 0;
        for (const line of ta.value.split(/\r?\n/)) {
          const cols = line.split(/[\t,，、]/).map((s) => s.trim());
          if (!cols[0]) continue;
          if (cols[0] === '姓') continue;
          if (!cols[1]) { bad++; continue; }
          const key = (noSpace(cols[0]) + noSpace(cols[1])).toLowerCase();
          if (seen.has(key)) { skipped++; continue; }
          seen.add(key);
          const score = numOrNull(cols[4]);
          rows.push({
            team_id: state.team.id, last_name: noSpace(cols[0]), first_name: noSpace(cols[1]),
            name: joinName(cols[0], cols[1]), last_kana: kanaVal(cols[2]) || null, first_kana: kanaVal(cols[3]),
            avg_score: score != null && score >= 50 && score <= 200 ? score : null,
            affiliation: strOrNull(cols[5]), tee: teeFromText(cols[6])
          });
        }
        if (!rows.length) return toast(bad ? '姓と名の両方が必要です（名が空の行があります）' : (skipped ? '新しく追加する人がいません' : '取り込む行がありません'));
        must(await state.sb.from('players').insert(rows));
        toast(`${rows.length}人追加しました` + (skipped ? `（${skipped}人は登録済みのため飛ばしました）` : '') + (bad ? `（${bad}行は名が空のため飛ばしました）` : ''));
        location.hash = '#/players';
      })
    }, '取り込む')),
    el('p', {}, el('a', { class: 'btn block', href: '#/players' }, 'キャンセル'))
  ];
}

/* ====== 成績・順位 ====== */
async function viewResults(id) {
  const sb = state.sb;
  const [evR, enR] = await Promise.all([
    sb.from('events').select('id,name,event_date,course_name').eq('id', id).single(),
    sb.from('entries').select('*').eq('event_id', id).eq('approval', 'approved')
  ]);
  const ev = must(evR);
  const people = must(enR).filter((e) => e.attendance === 'join');
  const root = el('div', {});
  let preview = null;
  const order = () => [...people].sort((a, b) => (a.result_rank ?? 999) - (b.result_rank ?? 999)
    || (a.net ?? 999) - (b.net ?? 999) || String(a.last_kana || a.name).localeCompare(String(b.last_kana || b.name), 'ja'));
  const save = (e, patch) => guard(async () => { must(await sb.from('entries').update(patch).eq('id', e.id)); Object.assign(e, patch); });
  const msg = el('div', { class: 'muted' });
  const fileIn = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
  const readBtn = el('button', { class: 'btn pri block', onclick: () => fileIn.click() }, '📷 順位表の写真を読み込む');
  const match = (row) => {
    const k = norm(row.name || '');
    if (!k) return null;
    const hit = people.find((e) => norm(e.name) === k) || people.find((e) => norm((e.last_kana || '') + (e.first_kana || '')) === k);
    return hit ? hit.id : null;
  };
  fileIn.addEventListener('change', () => guard(async () => {
    const files = [...fileIn.files].slice(0, 8);
    if (!files.length) return;
    readBtn.disabled = true; msg.textContent = '読み取り中…（20〜40秒ほどかかります）';
    try {
      const images = await Promise.all(files.map((f) => fileToJpeg(f)));
      const r = await fetch(`${SB_URL}/functions/v1/read-results`, {
        method: 'POST', headers: { 'content-type': 'application/json', 'x-team-token': state.token, apikey: SB_KEY },
        body: JSON.stringify({ images })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error === 'rate_limited' ? 'rate_limited' : 'read_failed');
      preview = (j.data.rows || []).map((row) => ({ row, entryId: match(row) || '' }));
      msg.textContent = `${preview.length}人分を読み取りました。名前の対応を確認して「反映する」を押してください。`;
      draw();
    } catch (e) { msg.textContent = ''; throw e; } finally { readBtn.disabled = false; fileIn.value = ''; }
  }));
  const applyPreview = () => guard(async () => {
    const ok = preview.filter((p) => p.entryId);
    await Promise.all(ok.map(async (p) => {
      const e = people.find((x) => x.id === p.entryId);
      const patch = { gross: p.row.gross ?? null, net: p.row.net ?? null, result_rank: p.row.rank ?? null };
      must(await sb.from('entries').update(patch).eq('id', e.id)); Object.assign(e, patch);
    }));
    toast(`${ok.length}人の成績を反映しました`);
    preview = null; msg.textContent = ''; draw();
  });
  const autoRank = () => guard(async () => {
    const l = people.filter((e) => e.net != null).sort((a, b) => a.net - b.net);
    await Promise.all(l.map(async (e, i) => {
      const r = i > 0 && l[i - 1].net === e.net ? l[i - 1]._r : i + 1;
      e._r = r;
      must(await sb.from('entries').update({ result_rank: r }).eq('id', e.id)); e.result_rank = r;
    }));
    toast('ネットの小さい順に、順位を付けました（同スコアは同順位）'); draw();
  });
  const numField = (label, e, key, step) => {
    const inp = el('input', { type: 'number', inputmode: 'decimal', step: step || '1', value: e[key] ?? '', style: 'width:100%' });
    inp.addEventListener('change', () => { const v = inp.value === '' ? null : Number(inp.value); save(e, { [key]: Number.isFinite(v) ? v : null }); });
    return el('div', {}, el('small', { class: 'muted' }, label), inp);
  };
  function draw() {
    const nodes = [];
    if (preview) {
      nodes.push(el('div', { class: 'card' }, el('strong', {}, '読み取り結果（反映前）'),
        ...preview.map((p) => {
          const sel = el('select', {}, el('option', { value: '' }, '（反映しない）'),
            ...people.map((e) => el('option', { value: e.id }, e.name)));
          sel.value = p.entryId; sel.addEventListener('change', () => { p.entryId = sel.value; });
          return el('div', { style: 'padding:8px 0;border-bottom:1px solid var(--bd)' },
            el('div', {}, el('b', {}, p.row.name), el('span', { class: 'muted' }, `　順位${p.row.rank ?? '-'}　グロス${p.row.gross ?? '-'}　ネット${p.row.net ?? '-'}`)), sel);
        }),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', { class: 'btn pri', onclick: applyPreview }, '反映する'),
          el('button', { class: 'btn', onclick: () => { preview = null; msg.textContent = ''; draw(); } }, 'やめる'))));
    }
    for (const e of order()) {
      const sex = el('select', {}, el('option', { value: '' }, '-'), el('option', { value: 'M' }, '男'), el('option', { value: 'F' }, '女'));
      sex.value = e.sex || ''; sex.addEventListener('change', () => save(e, { sex: sex.value || null }));
      nodes.push(el('div', { class: 'card', style: 'padding:10px' },
        el('strong', {}, e.name),
        el('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px' },
          numField('順位', e, 'result_rank'), numField('グロス', e, 'gross'), numField('ネット', e, 'net', '0.1'),
          el('div', {}, el('small', { class: 'muted' }, '性別'), sex))));
    }
    if (!people.length) nodes.push(el('div', { class: 'card muted' }, '参加者がいません'));
    root.replaceChildren(...nodes);
  }
  draw();
  return [
    el('div', { class: 'row between' },
      el('div', {}, el('h2', { style: 'margin-bottom:0' }, '成績・順位'), el('div', { class: 'muted' }, ev.name)),
      el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
    el('div', { class: 'card' }, readBtn, msg, fileIn,
      el('p', { class: 'muted' }, '成績表の写真を読み込むと、順位・グロス・ネットが入ります（名前が合わない人は選び直せます）。手で直すこともできます。'),
      el('div', { class: 'row' }, el('button', { class: 'btn sm', onclick: autoRank }, 'ネットから順位を計算し直す'))),
    root
  ];
}

/* ====== 賞・商品 ====== */
async function viewAwards(id) {
  const sb = state.sb;
  const [evR, enR, spR, awR] = await Promise.all([
    sb.from('events').select('*').eq('id', id).single(),
    sb.from('entries').select('*').eq('event_id', id).eq('approval', 'approved'),
    sb.from('special_records').select('*').eq('event_id', id),
    sb.from('awards').select('*').eq('event_id', id)
  ]);
  const ev = must(evR), people = must(enR).filter((e) => e.attendance === 'join'), specials = must(spR);
  if (awR.error) return [el('div', { class: 'row between' }, el('h2', {}, '賞・商品'), el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
    el('div', { class: 'card' }, 'この機能を使うには、データベースの準備（SQL）が必要です。')];
  let awards = awR.data || [];
  const yen = (n) => Number(n).toLocaleString('ja-JP') + '円';
  const budgetIn = el('input', { type: 'number', inputmode: 'numeric', value: ev.prize_budget ?? '', placeholder: '例：200000' });
  budgetIn.addEventListener('change', () => guard(async () => {
    const v = budgetIn.value === '' ? null : parseInt(budgetIn.value, 10);
    if (v != null && (!Number.isFinite(v) || v < 0)) return toast('予算は0以上の数字で入れてください');
    must(await sb.from('events').update({ prize_budget: v }).eq('id', id));
    ev.prize_budget = v; draw();
  }));
  const sumBox = el('div', {});
  const KIND = { nearpin: 'ニアピン', drive: 'ドラコン' };
  const spTitle = (r) => `${r.course ? r.course + ' ' : ''}${KIND[r.kind]} ${r.hole_no ? r.hole_no + '番' : '未定'}`;
  const nameOf = (eid) => { const e = people.find((x) => x.id === eid); return e ? e.name : ''; };
  const sexTxt = { M: '男性', F: '女性' };
  const ruleTxt = (a) => ({ net_rank: `ネット${a.rank_no || 1}位`, gross_rank: `グロス${a.rank_no || 1}位` + (a.sex ? `（${sexTxt[a.sex]}）` : ''),
    booby: `ネット下から${a.rank_no || 2}番目`, special: (() => { const r = specials.find((x) => x.id === a.special_id); return r ? spTitle(r) : 'ニアピン・ドラコン（未選択）'; })(), manual: '手で決める' })[a.rule];
  const root = el('div', {});
  const sorted = () => [...awards].sort((a, b) => a.sort - b.sort || String(a.created_at).localeCompare(String(b.created_at)));

  // 自動計算
  const netRank = () => {
    const m = new Map(); const l = people.filter((e) => e.net != null).sort((a, b) => a.net - b.net);
    l.forEach((e, i) => m.set(e.id, e.result_rank ?? (i > 0 && l[i - 1].net === e.net ? m.get(l[i - 1].id) : i + 1)));
    return m;
  };
  const candidates = (a) => {
    if (a.rule === 'net_rank') { const m = netRank(); return people.filter((e) => m.get(e.id) === (a.rank_no || 1)).map((e) => e.id); }
    if (a.rule === 'gross_rank') {
      const l = people.filter((e) => e.gross != null && (!a.sex || e.sex === a.sex));
      return l.filter((e) => 1 + l.filter((x) => x.gross < e.gross).length === (a.rank_no || 1)).map((e) => e.id);
    }
    if (a.rule === 'booby') {
      const l = people.filter((e) => e.net != null).sort((x, y) => y.net - x.net);
      const t = l[(a.rank_no || 2) - 1]; return t ? l.filter((e) => e.net === t.net).map((e) => e.id) : [];
    }
    if (a.rule === 'special') { const r = specials.find((x) => x.id === a.special_id); return r && r.winner_entry_id ? [r.winner_entry_id] : []; }
    return [];
  };
  const save = (a, patch) => guard(async () => { must(await sb.from('awards').update(patch).eq('id', a.id)); Object.assign(a, patch); });
  const autoFill = () => guard(async () => {
    let n = 0, multi = 0;
    for (const a of sorted()) {
      if (a.rule === 'manual') continue;
      const c = candidates(a);
      if (c.length === 1 && a.winner_entry_id !== c[0]) { must(await sb.from('awards').update({ winner_entry_id: c[0] }).eq('id', a.id)); a.winner_entry_id = c[0]; n++; }
      else if (c.length > 1) multi++;
    }
    toast(`${n}件の受賞者を入れました` + (multi ? `（同スコアで決まらない賞が${multi}件あります）` : ''));
    draw();
  });
  const addAwards = (rows) => guard(async () => {
    const base = Math.max(0, ...awards.map((a) => a.sort)) + 1;
    const made = must(await sb.from('awards').insert(rows.map((r, i) => ({ event_id: id, sort: base + i, ...r }))).select());
    awards.push(...made); draw();
  });
  const preset = () => addAwards([
    { name: '優勝', rule: 'net_rank', rank_no: 1 }, { name: '準優勝', rule: 'net_rank', rank_no: 2 }, { name: '第3位', rule: 'net_rank', rank_no: 3 },
    { name: 'ベストグロス', rule: 'gross_rank', rank_no: 1 }, { name: 'ブービー賞', rule: 'booby', rank_no: 2 },
    ...specials.map((r) => ({ name: spTitle(r), rule: 'special', special_id: r.id }))]);
  const copyResult = () => {
    const lines = [`【${ev.name} 表彰】`];
    for (const a of sorted()) {
      const w = a.winner_entry_id ? nameOf(a.winner_entry_id) : '';
      lines.push(`${a.name}：${w ? w + 'さん' : '（未定）'}` + (a.prize ? `　${a.prize}` : ''));
    }
    copyText(lines.join('\n'));
  };

  const form = { name: el('input', { placeholder: '例：ベスグロ（女性）' }), rule: el('select', {},
    el('option', { value: 'net_rank' }, 'ネットの順位'), el('option', { value: 'gross_rank' }, 'グロスの順位'),
    el('option', { value: 'booby' }, 'ネットの下から数える（ブービー）'), el('option', { value: 'special' }, 'ニアピン・ドラコン'), el('option', { value: 'manual' }, '手で決める（飛び賞など）')),
    rank: el('input', { type: 'number', inputmode: 'numeric', placeholder: '何位（ブービーは下から何番目）' }),
    sex: el('select', {}, el('option', { value: '' }, '男女の区別なし'), el('option', { value: 'M' }, '男性だけ'), el('option', { value: 'F' }, '女性だけ')),
    sp: el('select', {}, el('option', { value: '' }, '選んでください'), ...specials.map((r) => el('option', { value: r.id }, spTitle(r)))) };

  function draw() {
    const cnt = new Map(); for (const a of awards) if (a.winner_entry_id) cnt.set(a.winner_entry_id, (cnt.get(a.winner_entry_id) || 0) + 1);
    const total = awards.reduce((t, a) => t + (a.price || 0) * (a.qty || 1), 0);
    const unpriced = awards.filter((a) => a.price == null).length;
    const diff = ev.prize_budget != null ? ev.prize_budget - total : null;
    const hint = ev.compe_fee ? Number(ev.compe_fee) * people.length : 0;
    sumBox.replaceChildren(el('div', { class: 'card' }, el('strong', {}, '商品の予算'),
      el('label', {}, '予算（円）'), budgetIn,
      hint && ev.prize_budget !== hint ? el('p', { class: 'muted' },
        `目安：コンペ費${yen(ev.compe_fee)}×参加${people.length}人＝${yen(hint)}　`,
        el('button', { class: 'btn sm', onclick: () => { budgetIn.value = hint; budgetIn.dispatchEvent(new Event('change')); } }, 'この金額を予算にする')) : null,
      el('div', { class: 'stats', style: 'grid-template-columns:repeat(3,1fr);margin-top:8px' },
        el('div', {}, el('b', {}, yen(total)), el('span', {}, '商品の合計')),
        el('div', {}, el('b', {}, ev.prize_budget != null ? yen(ev.prize_budget) : '-'), el('span', {}, '予算')),
        el('div', { style: diff != null && diff < 0 ? 'color:#c62828' : '' }, el('b', {}, diff == null ? '-' : (diff < 0 ? '−' + yen(-diff) : yen(diff))), el('span', {}, diff == null ? '差額' : (diff < 0 ? '予算オーバー' : 'あと使える額')))),
      unpriced ? el('p', { class: 'muted' }, `金額が未入力の商品が${unpriced}件あります（合計に入っていません）`) : null));
    const cards = sorted().map((a) => {
      const c = candidates(a);
      const sel = el('select', {}, el('option', { value: '' }, '未定'), ...people.map((e) => el('option', { value: e.id }, (c.includes(e.id) ? '★ ' : '') + e.name)));
      sel.value = a.winner_entry_id || '';
      sel.addEventListener('change', () => save(a, { winner_entry_id: sel.value || null }).then(draw));
      const prize = el('input', { value: a.prize || '', placeholder: '商品（例：松阪牛すき焼きセット）' });
      prize.addEventListener('change', () => save(a, { prize: strOrNull(prize.value) }));
      const price = el('input', { type: 'number', inputmode: 'numeric', value: a.price ?? '', placeholder: '1個あたり（円）' });
      price.addEventListener('change', () => save(a, { price: price.value === '' ? null : Math.max(0, parseInt(price.value, 10) || 0) }).then(draw));
      const qty = el('input', { type: 'number', inputmode: 'numeric', value: a.qty ?? 1, min: 1 });
      qty.addEventListener('change', () => save(a, { qty: Math.max(1, parseInt(qty.value, 10) || 1) }).then(draw));
      const dup = a.winner_entry_id && cnt.get(a.winner_entry_id) > 1;
      return el('div', { class: 'card' },
        el('div', { class: 'row between' }, el('strong', {}, a.name),
          el('button', { class: 'btn sm', onclick: () => guard(async () => {
            if (!confirm(`「${a.name}」を削除しますか？`)) return;
            must(await sb.from('awards').delete().eq('id', a.id)); awards = awards.filter((x) => x.id !== a.id); draw();
          }) }, '削除')),
        el('div', { class: 'muted' }, ruleTxt(a)),
        el('label', {}, '商品'), prize,
        el('div', { class: 'row', style: 'flex-wrap:nowrap' },
          el('div', { class: 'grow' }, el('label', {}, '金額（1個・円）'), price),
          el('div', { style: 'width:90px' }, el('label', {}, '数量'), qty)),
        a.price != null && (a.qty || 1) > 1 ? el('div', { class: 'muted' }, `小計 ${yen(a.price * a.qty)}`) : null,
        el('label', {}, '受賞者'), sel,
        a.rule !== 'manual' && c.length > 1 ? el('div', { class: 'note' }, `同スコアで決まりません。候補（★）：${c.map(nameOf).join('、')}`) : null,
        a.rule !== 'manual' && c.length === 0 && !a.winner_entry_id ? el('div', { class: 'muted' }, '対象の成績がまだありません') : null,
        dup ? el('div', { class: 'note' }, `⚠ ${nameOf(a.winner_entry_id)}さんは${cnt.get(a.winner_entry_id)}つの賞に入っています`) : null);
    });
    root.replaceChildren(
      sumBox,
      !awards.length ? el('div', { class: 'card' }, el('p', {}, 'まだ賞がありません。ひな形から始めると楽です。'), el('button', { class: 'btn pri block', onclick: preset }, '優勝・準優勝・3位・ベスグロ・ブービー・ニアピン/ドラコンを入れる')) : null,
      ...cards,
      el('div', { class: 'card' }, el('strong', {}, '賞を追加'),
        el('label', {}, '賞の名前'), form.name, el('label', {}, '決め方'), form.rule,
        el('label', {}, '何位（任意）'), form.rank, el('label', {}, '男女'), form.sex, el('label', {}, 'ニアピン・ドラコン（その賞のとき）'), form.sp,
        el('p', {}, el('button', { class: 'btn block', onclick: () => {
          const name = form.name.value.trim(); if (!name) return toast('賞の名前を入れてください');
          if (form.rule.value === 'special' && !form.sp.value) return toast('ニアピン・ドラコンを選んでください');
          addAwards([{ name, rule: form.rule.value, rank_no: numOrNull(form.rank.value), sex: form.sex.value || null, special_id: form.rule.value === 'special' ? form.sp.value : null }]);
          form.name.value = ''; form.rank.value = '';
        } }, '追加'))),
      awards.length ? el('div', { class: 'row' }, el('button', { class: 'btn pri grow', onclick: autoFill }, '受賞者を自動で入れる'), el('button', { class: 'btn grow', onclick: copyResult }, 'LINE用の表彰結果をコピー')) : null);
  }
  draw();
  return [
    el('div', { class: 'row between' },
      el('div', {}, el('h2', { style: 'margin-bottom:0' }, '賞・商品'), el('div', { class: 'muted' }, ev.name)),
      el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
    el('div', { class: 'muted', style: 'margin:6px 0' }, '成績は「成績・順位」で入れます。ニアピン・ドラコンの受賞者は、その画面の入力が反映されます。'),
    root
  ];
}

/* ====== 集金チェック ====== */
async function viewCollect(id) {
  const sb = state.sb;
  const d = await loadGroupData(id);
  const { ev, entries, slots, members } = d;
  const num = (n) => Number(n).toLocaleString('ja-JP');
  const lab = slotLabels(slots);
  const orgPlay = ev.playfee_by_self === false;
  const comp = ev.compe_fee || 0, play = ev.fee_per_person || 0, small = ev.small_group_fee || 0;
  const slotIdx = new Map([...slots].sort(slotOrder).map((g, i) => [g.id, i]));
  const joined = entries.filter((e) => e.attendance === 'join');
  const sizeOf = new Map();
  for (const g of slots) sizeOf.set(g.id, members.filter((m) => m.group_id === g.id && joined.some((e) => e.id === m.entry_id)).length);

  const info = (e) => {
    const m = members.find((x) => x.entry_id === e.id);
    const g = m ? slots.find((x) => x.id === m.group_id) : null;
    const two = !!g && sizeOf.get(g.id) === 2;
    const parts = [];
    if (comp) parts.push(['コンペ費', comp]);
    if (orgPlay && play) parts.push(['プレー代', play]);
    if (orgPlay && two && small) parts.push(['2名組追加', small]);
    const due = parts.reduce((t, p) => t + p[1], 0);
    return { g, m, two, parts, due, order: g ? slotIdx.get(g.id) : 999, pos: m ? m.position : 0 };
  };
  const rows = joined.map((e) => ({ e, ...info(e) })).sort((a, b) => a.order - b.order || a.pos - b.pos || String(a.e.last_kana || a.e.name).localeCompare(String(b.e.last_kana || b.e.name), 'ja'));
  const isPaid = (r) => r.e.paid_amount != null;
  let onlyUnpaid = false;
  const root = el('div', {});

  const setPaid = (r, amount) => guard(async () => {
    const patch = amount == null ? { paid_amount: null, paid_at: null } : { paid_amount: amount, paid_at: new Date().toISOString() };
    must(await sb.from('entries').update(patch).eq('id', r.e.id));
    Object.assign(r.e, patch);
    draw();
  });
  const unpaidText = () => {
    const l = rows.filter((r) => !isPaid(r) && r.due > 0);
    return [`【${ev.name} 集金・未回収】`, ...l.map((r) => `${r.g ? lab.get(r.g.id) : '未配置'} ${r.e.name}　${num(r.due)}円`)].join('\n');
  };
  function draw() {
    const total = rows.reduce((t, r) => t + r.due, 0);
    const got = rows.reduce((t, r) => t + (isPaid(r) ? r.e.paid_amount : 0), 0);
    const left = rows.filter((r) => !isPaid(r) && r.due > 0);
    const shown = onlyUnpaid ? rows.filter((r) => !isPaid(r)) : rows;
    const cancelled = entries.filter((e) => e.attendance === 'cancelled');
    root.replaceChildren(
      el('div', { class: 'stats', style: 'grid-template-columns:repeat(3,1fr)' },
        el('div', {}, el('b', {}, num(got) + '円'), el('span', {}, '回収済')),
        el('div', {}, el('b', {}, num(Math.max(0, total - got)) + '円'), el('span', {}, `未回収（${left.length}人）`)),
        el('div', {}, el('b', {}, num(total) + '円'), el('span', {}, `予定合計（${rows.length}人）`))),
      !comp && !(orgPlay && play) ? el('div', { class: 'card muted' }, 'このコンペは、幹事が集めるお金が未設定です（コンペ費、またはプレーフィーを「幹事がまとめて集金」にすると集計されます）。') : null,
      el('div', { class: 'row', style: 'margin:8px 0' },
        el('button', { class: 'btn sm' + (onlyUnpaid ? ' pri' : ''), onclick: () => { onlyUnpaid = !onlyUnpaid; draw(); } }, onlyUnpaid ? '未回収だけ表示中' : '未回収だけ表示'),
        el('button', { class: 'btn sm', onclick: () => copyText(unpaidText()) }, '未回収リストをコピー')),
      ...shown.map((r) => el('div', { class: 'mem', style: 'cursor:default;gap:10px' + (isPaid(r) ? ';background:#eef3ef' : '') },
        el('button', { class: 'btn' + (isPaid(r) ? ' pri' : ''), style: 'min-width:64px', onclick: () => setPaid(r, isPaid(r) ? null : r.due) }, isPaid(r) ? '済 ✓' : '受取'),
        el('div', { class: 'grow' },
          el('div', {}, el('small', {}, r.g ? lab.get(r.g.id) + ' ' + noZeroT(hhmm(r.g.start_time)) : '未配置'), ' ', el('strong', {}, r.e.name),
            r.two && el('span', { class: 'badge warn', style: 'margin-left:6px' }, '2名組')),
          el('small', {}, r.due ? `${num(r.due)}円（${r.parts.map((p) => p[0] + num(p[1])).join('＋')}）` : '集金なし')
            , r.two && !orgPlay && small ? el('small', {}, `　※ゴルフ場で +${num(small)}円`) : null,
          isPaid(r) && r.e.paid_amount !== r.due ? el('div', {}, el('small', {}, `受取 ${num(r.e.paid_amount)}円（予定と違います）`)) : null),
        el('button', { class: 'btn sm', onclick: () => {
          const v = prompt('受け取った金額（円）', String(isPaid(r) ? r.e.paid_amount : r.due));
          if (v == null) return;
          const n = parseInt(String(v).replace(/[,，円\s]/g, ''), 10);
          if (!Number.isFinite(n) || n < 0) return toast('金額を数字で入力してください');
          setPaid(r, n);
        } }, '金額')),
      ),
      !shown.length ? el('div', { class: 'card muted' }, onlyUnpaid ? '未回収の人はいません 🎉' : '参加者がいません') : null,
      cancelled.length ? el('div', { class: 'card' }, el('strong', {}, `当日キャンセル（${cancelled.length}人）`),
        el('p', { class: 'muted' }, cancelled.map((e) => e.name).join('、')),
        el('p', { class: 'muted' }, 'キャンセル料などがあれば、ここには含まれていません。')) : null);
  }
  draw();
  return [
    el('div', { class: 'row between' },
      el('div', {}, el('h2', { style: 'margin-bottom:0' }, '集金チェック'), el('div', { class: 'muted' }, ev.name)),
      el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
    root
  ];
}

/* ====== ニアピン・ドラコン ====== */
async function viewSpecial(id) {
  const sb = state.sb;
  const [evR, enR, spR, grR] = await Promise.all([
    sb.from('events').select('id,name,event_date,course_name').eq('id', id).single(),
    sb.from('entries').select('id,name,last_kana,attendance,approval').eq('event_id', id),
    sb.from('special_records').select('*').eq('event_id', id),
    sb.from('groups').select('id,start_course').eq('event_id', id)
  ]);
  const ev = must(evR), entries = must(enR).filter((e) => e.approval === 'approved');
  let recs = must(spR);
  const grs = must(grR);
  const gm = grs.length ? must(await sb.from('group_members').select('group_id,entry_id').in('group_id', grs.map((g) => g.id))) : [];
  const courseOfEntry = new Map(gm.map((m) => [m.entry_id, (grs.find((g) => g.id === m.group_id) || {}).start_course]));
  const people = entries.filter((e) => e.attendance === 'join')
    .sort((a, b) => String(a.last_kana || a.name).localeCompare(String(b.last_kana || b.name), 'ja'));
  const nameOf = (eid) => { const e = entries.find((x) => x.id === eid); return e ? e.name : null; };
  const KIND = { nearpin: 'ニアピン', drive: 'ドラコン' };
  const COURSE_RANK = { OUT: 0, IN: 1 };
  const scopeName = (c) => (c ? c + 'スタート組' : '全体');
  // 回る順：OUTスタートは1→18番、INスタートは10→18→1→9番の順（ホール未定は最後）
  const playOrder = (r) => (r.hole_no == null ? 99 : (r.course === 'IN' && r.hole_no <= 9 ? r.hole_no + 18 : r.hole_no));
  const sorted = () => [...recs].sort((a, b) => (COURSE_RANK[a.course] ?? 2) - (COURSE_RANK[b.course] ?? 2)
    || playOrder(a) - playOrder(b)
    || (a.kind === b.kind ? 0 : a.kind === 'nearpin' ? -1 : 1)
    || String(a.created_at).localeCompare(String(b.created_at)));
  const title = (r) => `${r.course ? r.course + '　' : ''}${KIND[r.kind]}　${r.hole_no ? r.hole_no + '番ホール' : 'ホール未定'}`;
  const resultText = () => {
    const lines = [`【${ev.name} ${KIND.nearpin}・${KIND.drive}】`];
    let cur = '__';
    for (const r of sorted()) {
      if ((r.course || '') !== cur) { cur = r.course || ''; if (recs.some((x) => x.course)) lines.push('', `■${scopeName(r.course)}`); }
      const w = r.winner_entry_id ? nameOf(r.winner_entry_id) : null;
      lines.push(`${KIND[r.kind]} ${r.hole_no ? r.hole_no + '番ホール' : 'ホール未定'}：` + (w ? w + 'さん' + (r.record ? `（${r.record}）` : '') + (r.note ? ` ${r.note}` : '') : '（未定）'));
    }
    return lines.join('\n');
  };

  const root = el('div', {});
  const kindSel = el('select', {}, el('option', { value: 'nearpin' }, 'ニアピン'), el('option', { value: 'drive' }, 'ドラコン'));
  const holeIn = el('input', { type: 'number', inputmode: 'numeric', placeholder: '例：7（当日まで未定なら空のまま）' });
  const scopeSel = el('select', {}, el('option', { value: 'all' }, '全体（1つだけ）'),
    el('option', { value: 'both' }, 'OUT組とIN組、それぞれで'), el('option', { value: 'OUT' }, 'OUT組だけ'), el('option', { value: 'IN' }, 'IN組だけ'));

  const save = (r, patch) => guard(async () => {
    must(await sb.from('special_records').update(patch).eq('id', r.id));
    Object.assign(r, patch);
    toast('保存しました');
  });
  const card = (r) => {
    const pool = r.course && people.some((e) => courseOfEntry.get(e.id) === r.course) ? people.filter((e) => courseOfEntry.get(e.id) === r.course) : people;
    const win = el('select', {}, el('option', { value: '' }, '未定'),
      ...pool.map((e) => el('option', { value: e.id }, e.name)));
    if (r.winner_entry_id && !pool.some((e) => e.id === r.winner_entry_id) && nameOf(r.winner_entry_id))
      win.append(el('option', { value: r.winner_entry_id }, nameOf(r.winner_entry_id)));
    win.value = r.winner_entry_id || '';
    win.addEventListener('change', () => save(r, { winner_entry_id: win.value || null }));
    const hole = el('input', { type: 'number', inputmode: 'numeric', value: r.hole_no ?? '', placeholder: '未定' });
    hole.addEventListener('change', () => {
      const n = numOrNull(hole.value);
      if (n != null && (n < 1 || n > 36)) { toast('ホール番号は1〜36です'); hole.value = r.hole_no ?? ''; return; }
      save(r, { hole_no: n }).then(draw);
    });
    const rec = el('input', { value: r.record || '', placeholder: r.kind === 'nearpin' ? '例：1.35m' : '例：285y' });
    rec.addEventListener('change', () => save(r, { record: strOrNull(rec.value) }));
    const note = el('input', { value: r.note || '', placeholder: '例：女性 / シニア / 同スコア' });
    note.addEventListener('change', () => save(r, { note: strOrNull(note.value) }));
    return el('div', { class: 'card' },
      el('div', { class: 'row between' }, el('strong', {}, title(r)),
        el('button', { class: 'btn sm', onclick: () => guard(async () => {
          if (!confirm(title(r) + ' を削除しますか？')) return;
          must(await sb.from('special_records').delete().eq('id', r.id));
          recs = recs.filter((x) => x.id !== r.id); draw();
        }) }, '削除')),
      el('label', {}, 'ホール番号'), hole,
      el('label', {}, '受賞者'), win,
      el('label', {}, '記録'), rec,
      el('label', {}, 'メモ（任意）'), note);
  };
  function draw() {
    root.replaceChildren(
      ...sorted().map(card),
      !recs.length ? el('div', { class: 'card muted' }, 'まだありません。下から追加してください。') : null,
      el('div', { class: 'card' },
        el('strong', {}, '追加する'),
        el('label', {}, '種類'), kindSel, el('label', {}, 'ホール番号'), holeIn,
        el('label', {}, '対象（OUT・INが同時スタートのとき）'), scopeSel,
        el('p', {}, el('button', { class: 'btn pri block', onclick: () => guard(async () => {

          const made = must(await sb.from('special_records').insert(rows).select());
          recs.push(...made); holeIn.value = ''; draw();
        }) }, '追加'))),
      recs.length ? el('button', { class: 'btn block', onclick: () => copyText(resultText()) }, 'LINE用の結果をコピー') : null);
  }
