  ];
}

/* ====== 組分け ====== */
const noZeroT = (t) => String(t || '').replace(/^0/, '');
const slotOrder = (a, b) => String(a.start_time || '').localeCompare(String(b.start_time || ''))
  || (a.start_course === b.start_course ? 0 : (a.start_course === 'OUT' ? -1 : 1)) || a.group_no - b.group_no;

// 組の呼び名：OUT1, OUT2 … / IN1, IN2 …（スタート時間順）
function slotLabels(slots) {
  const n = { OUT: 0, IN: 0 }, m = new Map();
  for (const g of [...slots].sort(slotOrder)) { const c = g.start_course === 'IN' ? 'IN' : 'OUT'; m.set(g.id, c + (++n[c])); }
  return m;
}

async function loadGroupData(id) {
  const sb = state.sb;
  const [evR, enR, plR, grR] = await Promise.all([
    sb.from('events').select('*').eq('id', id).single(),
    sb.from('entries').select('*').eq('event_id', id).eq('approval', 'approved'),
    sb.from('players').select('*'),
    sb.from('groups').select('*').eq('event_id', id)
  ]);
  const ev = must(evR), entries = must(enR), players = must(plR), slots = must(grR);
  slots.sort(slotOrder);
  const ids = slots.map((g) => g.id);
  let members = ids.length ? must(await sb.from('group_members').select('*').in('group_id', ids)) : [];
  { // 欠席・キャンセルになった人は、組から外す
    const joinIds = new Set(entries.filter((e) => e.attendance === 'join').map((e) => e.id));
    const stale = members.filter((m) => !joinIds.has(m.entry_id));
    if (stale.length) {
      await sb.from('group_members').delete().in('id', stale.map((m) => m.id));
      members = members.filter((m) => joinIds.has(m.entry_id));
    }
  }
  let rules = [], rulesOk = true;
  { const rr = await sb.from('group_rules').select('*').eq('event_id', id); if (rr.error) rulesOk = false; else rules = rr.data || []; }
  const pBy = new Map(players.map((p) => [p.id, p]));
  const eff = (e) => {
    const p = pBy.get(e.player_id) || {};
    return { aff: e.affiliation ?? p.affiliation ?? null, avg: e.avg_score ?? p.avg_score ?? null, tee: e.tee ?? p.tee ?? null };
  };
  return { ev, entries, slots, members, rules, rulesOk, eff };
}

// 平均スコアをそろえ、同じ所属が同じ組に偏らないよう振り分ける。
// rules: [{kind:'together'|'apart', a, b}]（entry id）
function autoAssign(people, g, wScore, wAff, rules) {
  rules = rules || [];
  const known = people.map((p) => p.avg).filter((v) => v != null).sort((a, b) => a - b);
  const med = known.length ? known[Math.floor(known.length / 2)] : 100;
  const P = new Map(people.map((p) => [p.id, { id: p.id, s: p.avg ?? med, a: p.aff ? noSpace(p.aff).toLowerCase() : null }]));
  const N = P.size, base = Math.floor(N / g), extra = N % g;
  const caps = Array.from({ length: g }, (_, i) => base + (i < extra ? 1 : 0));
  const maxCap = Math.max(...caps);
  const mean = [...P.values()].reduce((t, p) => t + p.s, 0) / N;

  // 「同じ組」は、つながった人どうしを1つのかたまりにする
  const par = new Map([...P.keys()].map((k) => [k, k]));
  const find = (x) => { while (par.get(x) !== x) { par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  for (const r of rules) if (r.kind === 'together' && P.has(r.a) && P.has(r.b)) par.set(find(r.a), find(r.b));
  const clusters = new Map();
  for (const k of P.keys()) { const r = find(k); if (!clusters.has(r)) clusters.set(r, []); clusters.get(r).push(P.get(k)); }
  let units = [];
  for (const m of clusters.values()) for (let i = 0; i < m.length; i += maxCap) units.push(m.slice(i, i + maxCap));
  const usum = (u) => u.reduce((t, p) => t + p.s, 0);
  units.sort((x, y) => y.length - x.length || usum(y) / y.length - usum(x) / x.length);

  const apart = new Set();
  for (const r of rules) if (r.kind === 'apart' && P.has(r.a) && P.has(r.b)) { apart.add(r.a + '|' + r.b); apart.add(r.b + '|' + r.a); }

  const G = Array.from({ length: g }, () => ({ units: [], n: 0, sum: 0 }));
  const put = (u) => {
    let best = -1, bv = Infinity;
    for (let i = 0; i < g; i++) {
      if (caps[i] - G[i].n < u.length) continue;
      const v = (G[i].sum + usum(u)) / caps[i];
      if (v < bv) { bv = v; best = i; }
    }
    if (best < 0) return false;
    G[best].units.push(u); G[best].n += u.length; G[best].sum += usum(u);
    return true;
  };
  for (const u of units) {
    if (put(u)) continue;
    for (const p of u) put([p]); // 入りきらないときは、かたまりをほどく
  }
  const flat = (grp) => grp.units.flat();
  const gcost = (grp) => {
    const l = flat(grp);
    if (!l.length) return 0;
    const avg = usum(l) / l.length;
    let c = wScore * (avg - mean) * (avg - mean) * l.length;
    const cnt = new Map();
    for (const p of l) if (p.a) cnt.set(p.a, (cnt.get(p.a) || 0) + 1);
    for (const v of cnt.values()) c += wAff * 30 * v * (v - 1) / 2;
    for (let x = 0; x < l.length; x++) for (let y = x + 1; y < l.length; y++) if (apart.has(l[x].id + '|' + l[y].id)) c += 2000;
    return c;
  };
  if (g > 1) {
    const iters = 16000;
    for (let it = 0; it < iters; it++) {
      const T = 20 * Math.pow(0.005, it / iters);
      const i = Math.floor(Math.random() * g);
      let j = Math.floor(Math.random() * (g - 1)); if (j >= i) j++;
      if (!G[i].units.length || !G[j].units.length) continue;
      const a = Math.floor(Math.random() * G[i].units.length);
      const sz = G[i].units[a].length;
      const cand = G[j].units.map((u, k) => (u.length === sz ? k : -1)).filter((k) => k >= 0);
      if (!cand.length) continue;
      const b = cand[Math.floor(Math.random() * cand.length)];
      const before = gcost(G[i]) + gcost(G[j]);
      [G[i].units[a], G[j].units[b]] = [G[j].units[b], G[i].units[a]];
      G[i].sum = usum(flat(G[i])); G[j].sum = usum(flat(G[j]));
      const delta = gcost(G[i]) + gcost(G[j]) - before;
      if (delta > 0 && Math.random() >= Math.exp(-delta / T)) {
        [G[i].units[a], G[j].units[b]] = [G[j].units[b], G[i].units[a]];
        G[i].sum = usum(flat(G[i])); G[j].sum = usum(flat(G[j]));
      }
    }
  }
  return G.map((grp) => flat(grp).sort((x, y) => y.s - x.s).map((p) => p.id));
}

// 今の配置でルールが守られているか： 'ok' | 'ng' | 'wait'(未配置あり)
function ruleState(rule, members) {
  const ga = members.find((m) => m.entry_id === rule.entry_a), gb = members.find((m) => m.entry_id === rule.entry_b);
  if (!ga || !gb) return 'wait';
  const same = ga.group_id === gb.group_id;
  return (rule.kind === 'together') === same ? 'ok' : 'ng';
}

function groupsAnnouncement(d) {
  const { ev, entries, slots, members } = d;
  const eBy = new Map(entries.map((e) => [e.id, e]));
  const num = (n) => Number(n).toLocaleString('ja-JP');
  const lines = [`【${ev.name} 組合せ】`, fmtDate(ev.event_date) + (ev.course_name ? ' ' + ev.course_name : ''), ''];
  let twos = 0;
  const lab = slotLabels(slots);
  for (const course of ['OUT', 'IN']) {
    let head = false;
    for (const g of slots.filter((x) => (x.start_course || 'OUT') === course)) {
      const ms = members.filter((m) => m.group_id === g.id).sort((a, b) => a.position - b.position)
        .map((m) => eBy.get(m.entry_id)).filter((e) => e && e.attendance === 'join');
      if (!ms.length) continue;
      if (!head) { if (lines[lines.length - 1] !== '') lines.push(''); lines.push(`■${course}スタート`); head = true; }
      if (ms.length === 2) twos++;
      lines.push(`${lab.get(g.id)}　${noZeroT(hhmm(g.start_time))}`);
      lines.push('　' + ms.map((e) => e.name).join('、'));
    }
  }
  const bySelf = ev.playfee_by_self !== false;
  const foot = [];
  if (ev.compe_fee != null) foot.push(`コンペ費：${num(ev.compe_fee)}円` + (ev.payment_note ? `（${ev.payment_note}）` : ''));
  if (ev.fee_per_person != null) {
    if (ev.compe_fee != null && !bySelf) foot.splice(0, 1, `参加費：${num(ev.fee_per_person + ev.compe_fee)}円（プレーフィー＋コンペ費合計）` + (ev.payment_note ? `／${ev.payment_note}` : ''));
    else foot.push(bySelf ? `プレーフィー：${num(ev.fee_per_person)}円（各自ゴルフ場で精算）` : `参加費：${num(ev.fee_per_person)}円` + (ev.payment_note ? `（${ev.payment_note}）` : ''));
  }
  if (ev.includes) foot.push('料金に含まれるもの：' + ev.includes);
  if (twos && ev.small_group_fee) foot.push(`※2名の組は、プレーフィーが1人あたり +${num(ev.small_group_fee)}円`);
  if (foot.length) lines.push('', ...foot);
  if (ev.notes_line) lines.push('', ev.notes_line);
  return lines.join('\n');
}

async function viewGroups(id) {
  let d = await loadGroupData(id);
  const sb = state.sb;
  const saved = (() => { try { return JSON.parse(ls.get('golf_auto_opts') || '{}'); } catch (e) { return {}; } })();
  const optAff = el('select', { value: saved.aff || 'normal' },
    el('option', { value: 'strong' }, '強く分ける'), el('option', { value: 'normal' }, 'ふつう'),
    el('option', { value: 'weak' }, '弱め'), el('option', { value: 'off' }, '考えない'));
  const optScore = el('select', { value: saved.score || 'normal' },
    el('option', { value: 'strong' }, '強くそろえる'), el('option', { value: 'normal' }, 'ふつう'), el('option', { value: 'weak' }, '弱め'));
  let selected = null;
  const root = el('div', {});
  const ruleKind = el('select', {}, el('option', { value: 'together' }, '同じ組にする'), el('option', { value: 'apart' }, '別の組にする'));
  const ruleA = el('select', {}), ruleB = el('select', {});
  const fillRuleSel = () => {
    const opts = d.entries.filter((e) => e.attendance === 'join')
      .sort((x, y) => String(x.last_kana || x.name).localeCompare(String(y.last_kana || y.name), 'ja'));
    for (const sel of [ruleA, ruleB]) {
      const cur = sel.value;
      sel.replaceChildren(el('option', { value: '' }, '選んでください'), ...opts.map((e) => el('option', { value: e.id }, e.name)));
      sel.value = cur;
    }
  };
  const addRule = () => guard(async () => {
    const a = ruleA.value, b = ruleB.value;
    if (!a || !b) return toast('2人を選んでください');
    if (a === b) return toast('同じ人は選べません');
    if (d.rules.some((r) => r.kind === ruleKind.value && ((r.entry_a === a && r.entry_b === b) || (r.entry_a === b && r.entry_b === a)))) return toast('同じルールがすでにあります');
    const row = must(await sb.from('group_rules').insert({ event_id: id, kind: ruleKind.value, entry_a: a, entry_b: b }).select().single());
    d.rules.push(row);
    ruleA.value = ''; ruleB.value = '';
    draw();
  });
  const delRule = (r) => guard(async () => {
    must(await sb.from('group_rules').delete().eq('id', r.id));
    d.rules = d.rules.filter((x) => x.id !== r.id);
    draw();
  });

  const eBy = () => new Map(d.entries.map((e) => [e.id, e]));
  const memRow = (entryId) => d.members.find((m) => m.entry_id === entryId) || null;
  const groupOf = (entryId) => { const m = memRow(entryId); return m ? d.slots.find((g) => g.id === m.group_id) : null; };
  const reload = async () => { d.members = must(await sb.from('group_members').select('*').in('group_id', d.slots.map((g) => g.id))); };
  const done = async () => { selected = null; await reload(); draw(); };

  const chip = (e) => {
    const f = d.eff(e);
    const gone = e.attendance !== 'join';
    return el('div', { class: 'mem' + (selected === e.id ? ' sel' : '') + (gone ? ' gone' : ''), onclick: () => onChip(e) },
      teeDot(f.tee), el('strong', {}, e.name),
      el('small', {}, [f.aff, f.avg != null ? '平均' + f.avg : null, gone ? (e.attendance === 'cancelled' ? '当日キャンセル' : '欠席') : null].filter(Boolean).join(' ・ ')));
  };

  const onChip = (e) => guard(async () => {
    const ga = selected ? groupOf(selected) : null;
    const gb = groupOf(e.id);
    if (gb && gb.locked) return toast('この組はロック中です');
    if (!selected) { selected = e.id; return draw(); }
    if (selected === e.id) { selected = null; return draw(); }
    if (ga && ga.locked) { selected = null; draw(); return toast('選んでいた人の組がロック中です'); }
    if ((ga && gb && ga.id === gb.id) || (!ga && !gb)) { selected = e.id; return draw(); }
    const ma = memRow(selected), mb = memRow(e.id);
    if (ma && mb) {
      must(await sb.from('group_members').update({ group_id: gb.id }).eq('id', ma.id));
      must(await sb.from('group_members').update({ group_id: ga.id }).eq('id', mb.id));
    } else if (ma && !mb) {
      must(await sb.from('group_members').delete().eq('id', ma.id));
      must(await sb.from('group_members').insert({ group_id: ga.id, entry_id: e.id, position: ma.position }));
    } else {
      must(await sb.from('group_members').delete().eq('id', mb.id));
      must(await sb.from('group_members').insert({ group_id: gb.id, entry_id: selected, position: mb.position }));
    }
    await done();
  });

  const moveTo = (g) => guard(async () => {
    const ma = memRow(selected), ga = groupOf(selected);
    if (ga && ga.locked) return toast('選んでいた人の組がロック中です');
    const cnt = d.members.filter((m) => m.group_id === g.id).length;
    if (cnt >= 4) return toast('この組は4人で満員です');
    const pos = Math.max(-1, ...d.members.filter((m) => m.group_id === g.id).map((m) => m.position)) + 1;
    if (ma) must(await sb.from('group_members').update({ group_id: g.id, position: pos }).eq('id', ma.id));
    else must(await sb.from('group_members').insert({ group_id: g.id, entry_id: selected, position: pos }));
    await done();
  });
  const dayCancel = (eid) => guard(async () => {
    const e = d.entries.find((x) => x.id === eid);
    if (!e) return;
    const g = groupOf(eid);
    if (!confirm(`${e.name}さんを当日キャンセルにします。`)) return;
    must(await sb.from('entries').update({ attendance: 'cancelled' }).eq('id', eid));
    await sb.from('group_members').delete().eq('entry_id', eid);
    e.attendance = 'cancelled';
    await done();
    if (g) {
      const n = d.members.filter((m) => m.group_id === g.id).length;
      const lab = slotLabels(d.slots).get(g.id);
      const fee = d.ev.small_group_fee;
      toast(n === 0 ? `${lab}は誰もいなくなりました` : n === 2 ? `${lab}が2名組になりました` + (fee ? `（追加料金 +${Number(fee).toLocaleString('ja-JP')}円/人）` : '') : `${lab}が${n}人になりました`);
    }
  });
  const restore = (eid) => guard(async () => {
    const e = d.entries.find((x) => x.id === eid);
    must(await sb.from('entries').update({ attendance: 'join' }).eq('id', eid));
    e.attendance = 'join';
    await done();
    toast(`${e.name}さんを参加に戻しました（未配置です）`);
  });
  const unassign = () => guard(async () => {
    const ma = memRow(selected), ga = groupOf(selected);
    if (ga && ga.locked) return toast('選んでいた人の組がロック中です');
    if (ma) must(await sb.from('group_members').delete().eq('id', ma.id));
    await done();
  });
  const toggleLock = (g) => guard(async () => {
    must(await sb.from('groups').update({ locked: !g.locked }).eq('id', g.id));
    g.locked = !g.locked;
    draw();
  });

  const runAuto = () => guard(async () => {
    const W = { aff: { strong: 3, normal: 1, weak: 0.4, off: 0 }, score: { strong: 2, normal: 1, weak: 0.3 } };
    ls.set('golf_auto_opts', JSON.stringify({ aff: optAff.value, score: optScore.value }));
    const lockedIds = new Set(d.slots.filter((g) => g.locked).map((g) => g.id));
    const lockedEntries = new Set(d.members.filter((m) => lockedIds.has(m.group_id)).map((m) => m.entry_id));
    const people = d.entries.filter((e) => e.attendance === 'join' && !lockedEntries.has(e.id))
      .map((e) => { const f = d.eff(e); return { id: e.id, avg: f.avg, aff: f.aff }; });
    const targets = d.slots.filter((g) => !g.locked);
    if (!people.length) return toast('組分けする参加者がいません');
    if (!targets.length) return toast('スタート枠がありません（ロックを外してください）');
    if (people.length > targets.length * 4) return toast(`枠が足りません（${people.length}人に対して最大${targets.length * 4}人）`);
    const hasOld = d.members.some((m) => !lockedIds.has(m.group_id));
    if (hasOld && !confirm('ロックしていない組を、作り直します。よろしいですか？')) return;
    const g = Math.min(targets.length, Math.max(1, Math.ceil(people.length / 4)));
    const pid = new Set(people.map((p) => p.id));
    const rl = d.rules.filter((r) => pid.has(r.entry_a) && pid.has(r.entry_b)).map((r) => ({ kind: r.kind, a: r.entry_a, b: r.entry_b }));
    const result = autoAssign(people, g, W.score[optScore.value], W.aff[optAff.value], rl);
    const useIds = targets.map((t) => t.id);
    must(await sb.from('group_members').delete().in('group_id', useIds));
    const rows = [];
    result.forEach((ids, gi) => ids.forEach((eid, pi) => rows.push({ group_id: targets[gi].id, entry_id: eid, position: pi })));
    must(await sb.from('group_members').insert(rows));
    await done();
    const ng = d.rules.filter((r) => ruleState(r, d.members) === 'ng').length;
    toast(`${people.length}人を${g}組に振り分けました` + (ng ? `（守れなかったルールが${ng}件あります）` : ''));
  });

  function draw() {
    const emap = eBy();
    const joined = d.entries.filter((e) => e.attendance === 'join');
    const assignedIds = new Set(d.members.map((m) => m.entry_id));
    const unassigned = joined.filter((e) => !assignedIds.has(e.id));
    const selGroup = selected ? groupOf(selected) : null;
    const cap = d.slots.length * 4;
    const lab = slotLabels(d.slots);
    const badRule = (g) => {
      const inG = new Set(d.members.filter((m) => m.group_id === g.id).map((m) => m.entry_id));
      return d.rules.some((r) => (inG.has(r.entry_a) || inG.has(r.entry_b)) && ruleState(r, d.members) === 'ng');
    };
    const nodes = [];

    nodes.push(el('div', { class: 'stats', style: 'grid-template-columns:repeat(3,1fr)' },
      el('div', {}, el('b', {}, joined.length), el('span', {}, `参加（枠は${d.slots.length}組・最大${cap}人）`)),
      el('div', {}, el('b', {}, joined.length - unassigned.length), el('span', {}, '配置済み')),
      el('div', {}, el('b', {}, unassigned.length), el('span', {}, '未配置'))));

    nodes.push(el('div', { class: 'card' },
      el('strong', {}, '自動で組分け'),
      el('p', { class: 'muted' }, 'ロックした組はそのまま、残りの人を、平均スコアがそろうように振り分けます。人数が4の倍数でないときは3人組にします。'),
      el('div', { class: 'row', style: 'flex-wrap:nowrap' },
        el('div', { class: 'grow' }, el('label', {}, '同じ所属'), optAff),
        el('div', { class: 'grow' }, el('label', {}, '組の強さ'), optScore)),
      el('p', {}, el('button', { class: 'btn pri block', onclick: runAuto }, '自動で組分けする')),
      el('div', { class: 'row' },
        el('button', { class: 'btn sm', onclick: () => copyText(groupsAnnouncement(d)) }, 'LINE用の組表をコピー'),
        el('a', { class: 'btn sm', href: `#/event/${id}/print` }, '印刷用を開く'))));

    fillRuleSel();
    const nm = (eid) => { const e = emap.get(eid); return e ? e.name : '（不明）'; };
    const stIcon = { ok: '✅', ng: '⚠️ 守れていません', wait: '未配置' };
    nodes.push(el('div', { class: 'card' },
      el('strong', {}, '同じ組・別の組のルール'),
      !d.rulesOk ? el('p', { class: 'muted' }, 'ルール機能を使うには、データベースの準備（SQL）が必要です。') : [
        el('p', { class: 'muted' }, '自動で組分けするときに守ります。ロックした組の人とのルールは自動では守れないので、手で入れ替えてください。'),
        d.rules.map((r) => el('div', { class: 'row between', style: 'padding:6px 0;border-bottom:1px solid var(--bd)' },
          el('div', {}, el('b', {}, `${nm(r.entry_a)} と ${nm(r.entry_b)}`), el('div', { class: 'muted' }, (r.kind === 'together' ? '同じ組' : '別の組') + '　' + stIcon[ruleState(r, d.members)])),
          el('button', { class: 'btn sm', onclick: () => delRule(r) }, '削除'))),
        el('div', { style: 'margin-top:8px' }, el('label', {}, '1人目'), ruleA, el('label', {}, '2人目'), ruleB, el('label', {}, 'ルール'), ruleKind),
        el('p', {}, el('button', { class: 'btn block', onclick: addRule }, 'ルールを追加'))]));

    if (selected) {
      const e = emap.get(selected);
      nodes.push(el('div', { class: 'card', style: 'background:#fff8e1;border-color:#f9a825' },
        el('div', { class: 'row between' },
          el('span', {}, `「${e ? e.name : ''}」を選択中。入れ替える人をタップ、または移動先の組のボタンを押します。`),
          el('div', { class: 'row' },
            el('button', { class: 'btn sm', onclick: () => dayCancel(selected) }, '当日キャンセルにする'),
            el('button', { class: 'btn sm', onclick: () => { selected = null; draw(); } }, '選択をやめる')))));
    }

    nodes.push(el('div', { class: 'gcard' + (selected && selGroup ? ' drop' : '') },
      el('div', { class: 'row between' }, el('strong', {}, `未配置（${unassigned.length}人）`),
        (selected && selGroup) ? el('button', { class: 'btn sm', onclick: unassign }, '未配置に戻す') : null),
      unassigned.length ? unassigned.map(chip) : el('div', { class: 'muted' }, 'なし')));

    for (const g of d.slots) {
      const ms = d.members.filter((m) => m.group_id === g.id).sort((a, b) => a.position - b.position)
        .map((m) => emap.get(m.entry_id)).filter(Boolean);
      const active = ms.filter((e) => e.attendance === 'join');
      const scores = active.map((e) => d.eff(e).avg).filter((v) => v != null);
      const avg = scores.length ? (scores.reduce((t, v) => t + v, 0) / scores.length).toFixed(1) : null;
      const unknown = active.length - scores.length;
      const canDrop = selected && !g.locked && (!selGroup || selGroup.id !== g.id) && ms.length < 4;
      nodes.push(el('div', { class: 'gcard' + (g.locked ? ' locked' : '') + (canDrop ? ' drop' : '') },
        el('div', { class: 'row between' },
          el('div', {}, el('strong', {}, `${lab.get(g.id)}　${noZeroT(hhmm(g.start_time))}`), ' ',
            (active.length === 2 || active.length === 1) && el('span', { class: 'badge warn' }, active.length === 1 ? '1名' : '2名組' + (d.ev.small_group_fee ? ` +${Number(d.ev.small_group_fee).toLocaleString('ja-JP')}円` : '')), ' ',
            active.length === 3 && el('span', { class: 'badge' }, '3人'), ' ',
            badRule(g) && el('span', { class: 'badge warn' }, '⚠ ルール'), ' ',
            el('span', { class: 'muted' }, (avg ? `平均${avg}` : '') + (unknown ? `（不明${unknown}人）` : ''))),
          el('button', { class: 'btn sm', onclick: () => toggleLock(g) }, g.locked ? '🔒 ロック中' : 'ロックする')),
        ms.length ? ms.map(chip) : el('div', { class: 'muted' }, '空き'),
        canDrop && el('button', { class: 'btn sm block', style: 'margin-top:8px', onclick: () => moveTo(g) }, `ここに入れる（${ms.length}/4）`)));
    }
    const cx = d.entries.filter((e) => e.attendance === 'cancelled');
    if (cx.length) nodes.push(el('div', { class: 'gcard' }, el('strong', {}, `当日キャンセル（${cx.length}人）`),
      cx.map((e) => el('div', { class: 'row between', style: 'padding:6px 0' }, el('span', {}, e.name),
        el('button', { class: 'btn sm', onclick: () => restore(e.id) }, '参加に戻す')))));
    root.replaceChildren(...nodes);
  }

  if (!d.slots.length) {
    return [el('div', { class: 'row between' }, el('h2', {}, '組分け'), el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
      el('div', { class: 'card' }, 'スタート枠が未登録です。コンペ画面で、スタート枠を登録してください。')];
  }
  draw();
  return [
    el('div', { class: 'row between' },
      el('div', {}, el('h2', { style: 'margin-bottom:0' }, '組分け'), el('div', { class: 'muted' }, d.ev.name)),
      el('a', { class: 'btn sm', href: '#/event/' + id }, '← コンペに戻る')),
    root
  ];
}

async function viewPrint(id) {
  const d = await loadGroupData(id);
  const emap = new Map(d.entries.map((e) => [e.id, e]));
  const lab = slotLabels(d.slots);
  const tbl = (course) => {
    const list = d.slots.filter((g) => (g.start_course || 'OUT') === course);
    if (!list.length) return null;
    const rows = list.map((g) => {
      const ms = d.members.filter((m) => m.group_id === g.id).sort((a, b) => a.position - b.position)
        .map((m) => emap.get(m.entry_id)).filter((e) => e && e.attendance === 'join');
      const cells = [0, 1, 2, 3].map((i) => {
        const e = ms[i];
        if (!e) return el('td', {}, '');
        return el('td', {}, e.name);
      });
      return el('tr', {}, el('td', {}, lab.get(g.id)), el('td', {}, noZeroT(hhmm(g.start_time))), ...cells);
    });
    return el('div', { style: 'margin-top:14px' }, el('h3', { style: 'margin:0 0 4px' }, course),
      el('table', { class: 'pt' },
        el('thead', {}, el('tr', {}, ['組', '時間', '1', '2', '3', '4'].map((h) => el('th', {}, h)))),
        el('tbody', {}, rows)));
  };
  return [
    el('div', { class: 'row between no-print' },
      el('a', { class: 'btn sm', href: `#/event/${id}/groups` }, '← 組分けに戻る'),
      el('button', { class: 'btn sm pri', onclick: () => window.print() }, '印刷する')),
    el('div', { class: 'muted no-print' }, 'PDF保存するときは、印刷画面の「ヘッダーとフッター」はオフのままでOKです（自動で入りません）'),
    el('h2', {}, `${d.ev.name} 組合せ`),
    el('div', { class: 'muted' }, fmtDate(d.ev.event_date) + (d.ev.course_name ? ' ' + d.ev.course_name : '')),
    tbl('OUT'), tbl('IN')
  ];
}

/* ====== チームの切り替え ====== */
async function viewTeams() {
  const teams = getTeams();
  const nameIn = el('input', { placeholder: '例：○○ゴルフ会 幹事チーム' });
  const urlIn = el('input', { placeholder: '幹事用URLを貼り付け' });
  const remove = (t) => {
    if (!confirm(`「${t.name}」をこの端末のリストから外します（データは消えません）。幹事用URLを控えていないと、戻れなくなります。`)) return;
    setTeams(getTeams().filter((x) => x.token !== t.token));
    if (t.token !== state.token) return refresh();
    const next = getTeams()[0];
    if (next) return switchTo(next.token);
    ls.del('golf_token');
    history.replaceState(null, '', location.pathname);
    state.team = null;
    renderWelcome();
  };
  return [
    el('h2', {}, 'チームを切り替える'),
    teams.map((t) => el('div', { class: 'card' },
      el('div', { class: 'row between' },
        el('div', {}, el('strong', {}, t.name), t.token === state.token && el('span', { class: 'badge', style: 'margin-left:6px' }, '使用中')),
        t.token === state.token ? null : el('button', { class: 'btn sm pri', onclick: () => switchTo(t.token) }, '切り替える')),
      el('div', { class: 'row', style: 'margin-top:8px' },
        el('button', { class: 'btn sm', onclick: () => copyText(`${base()}?t=${t.token}`) }, '幹事用URLをコピー'),
        el('button', { class: 'btn sm bad', onclick: () => remove(t) }, 'この端末から外す')))),
    el('div', { class: 'card' },
      el('strong', {}, '新しいチームを作る'),
      el('label', {}, 'チーム名'), nameIn,
      el('p', {}, el('button', {
        class: 'btn pri block', onclick: () => guard(async () => {
          if (!nameIn.value.trim()) return toast('チーム名を入力してください');
          const r = must(await makeClient(null).rpc('create_team', { p_name: nameIn.value }));
          const row = Array.isArray(r) ? r[0] : r;
          rememberTeam(row.admin_token, nameIn.value.trim());
          switchTo(row.admin_token);
        })
      }, 'チームを作って切り替える')),
      el('p', { class: 'muted' }, '作ったあとの「幹事用URL」は、設定のタブか、この画面の「幹事用URLをコピー」から控えてください。')),
    el('div', { class: 'card' },
      el('strong', {}, '幹事用URLでチームを追加'),
      el('p', { class: 'muted' }, '他の幹事から受け取ったURLを貼ると、そのチームをこの端末に追加します。'),
      urlIn,
      el('p', {}, el('button', {
        class: 'btn block', onclick: () => guard(async () => {
          const tok = tokenFromInput(urlIn.value);
          if (!tok) return toast('URLを確認してください');
          const team = await fetchTeam(tok);
          if (!team) return toast('このURLのチームが見つかりません');
          rememberTeam(tok, team.name);
          switchTo(tok);
        })
      }, '追加して切り替える')))
  ];
}

/* ====== 設定 ====== */
async function viewSettings() {
  const adminUrl = `${base()}?t=${state.token}`;
  const name = el('input', { value: state.team.name });
  return [
    el('h2', {}, '設定'),
    el('div', { class: 'card' },
      el('label', {}, 'チーム名'), name,
      el('p', {}, el('button', {
        class: 'btn sm pri', onclick: () => guard(async () => {
          if (!name.value.trim()) return toast('チーム名を入力してください');
          must(await state.sb.from('teams').update({ name: name.value.trim() }).eq('id', state.team.id));
          state.team.name = name.value.trim();
          toast('保存しました');
          refresh();
        })
      }, '保存'))),
    el('div', { class: 'card' },
      el('strong', {}, '幹事用URL'),
      el('p', { class: 'muted' }, '他の幹事にこのURLを送ると、同じ名簿・コンペを編集できます。URLを知っている人は誰でも編集できるので、幹事以外には送らないでください。参加者には、コンペごとの「出欠フォームURL」を配ります。'),
      el('input', { value: adminUrl, readonly: true, onclick: (e) => e.target.select() }),
      el('p', {}, el('button', { class: 'btn sm pri', onclick: () => copyText(adminUrl) }, '幹事用URLをコピー'))),
    el('div', { class: 'card' },
      el('a', { class: 'btn block', href: '#/teams' }, 'チームを切り替える・新しく作る'))
  ];
}

/* ====== 参加者用：出欠フォーム ====== */
function msgPage(title, text) {
  return el('div', {},
    el('header', {}, el('h1', {}, '⛳ ' + title)),
    el('main', {}, el('div', { class: 'card center' }, el('p', {}, text))));
}

async function renderForm(token) {
  state.sb = makeClient(null);
  mount(msgPage('読み込み中', '少々お待ちください…'));
  const { data, error } = await state.sb.rpc('form_get', { p_form_token: token });
  if (error || !data) return mount(msgPage('出欠フォーム', 'URLが正しくないようです。幹事さんに確認してください。'));
  const ev = data.event;
  document.title = ev.name + ' 出欠';
  if (!ev.is_open) return mount(msgPage(ev.name, '出欠の受付は終了しました。変更がある場合は幹事さんに連絡してください。'));

  const S = { attendance: null, party: null };
  const meKey = 'golf_me';
  let me = {};
  try { me = JSON.parse(ls.get(meKey) || '{}') || {}; } catch (e) { me = {}; }
  const newNm = nameInputs(me.l || '', me.f || '', me.lk || '', me.fk || '');
  const partyBox = el('div', { hidden: true });
  const attWrap = el('div', {});
  const partyWrap = el('div', {});
  const avg = el('input', { type: 'number', inputmode: 'numeric', placeholder: '例：98' });
  const avgBox = el('div', { hidden: true }, el('label', {}, '平均スコア（必須・初めての方は 0 と入力）'), avg);
  const note = el('textarea', { placeholder: '例：○○さんと同じ組を希望 / 早上がり希望 など（自動では反映されず、幹事が確認します）' });
  const submit = el('button', { class: 'btn pri block', type: 'button' }, '回答する');

  function drawAtt() {
    attWrap.replaceChildren(seg([['join', '参加します'], ['absent', '欠席します']], S.attendance, (v) => {
      S.attendance = v;
      if (v !== 'join') S.party = null;
      drawAtt();
    }, true));
    partyBox.hidden = !(ev.has_party && S.attendance === 'join');
    avgBox.hidden = S.attendance !== 'join';
    partyWrap.replaceChildren(seg([['join', '参加します'], ['absent', '参加しません']], S.party, (v) => {
      S.party = v;
      drawAtt();
    }, true));
  }
  partyBox.append(el('label', {}, '表彰式・打上げ'), partyWrap);

  submit.addEventListener('click', () => guard(async () => {
    if (!noSpace(newNm.l.value) || !noSpace(newNm.f.value)) return toast('姓と名を入力してください');
    if (!kanaVal(newNm.lk.value) || !kanaVal(newNm.fk.value)) return toast('姓のよみ・名のよみを入力してください');
    if (!S.attendance) return toast('参加／欠席を選んでください');
    if (ev.has_party && S.attendance === 'join' && !S.party) return toast('表彰式・打上げの参加可否を選んでください');
    if (S.attendance === 'join') {
      const sc = numOrNull(avg.value);
      if (sc == null) return toast('平均スコアを入力してください（初めての方は 0）');
      if (sc !== 0 && (sc < 50 || sc > 200)) return toast('平均スコアは50〜200で入力してください（初めての方は 0）');
    }
    submit.disabled = true;
    try {
      const res = must(await state.sb.rpc('form_submit', {
        p_form_token: token,
        p_player_id: null,
        p_last_name: noSpace(newNm.l.value),
        p_first_name: noSpace(newNm.f.value),
        p_last_kana: kanaVal(newNm.lk.value),
        p_first_kana: kanaVal(newNm.fk.value),
        p_attendance: S.attendance,
        p_party: ev.has_party && S.attendance === 'join' ? S.party : null,
        p_avg_score: S.attendance === 'join' ? numOrNull(avg.value) : null,
        p_note: strOrNull(note.value)
      }));
      ls.set(meKey, JSON.stringify({ l: noSpace(newNm.l.value), f: noSpace(newNm.f.value), lk: kanaVal(newNm.lk.value), fk: kanaVal(newNm.fk.value) }));
      const who = joinName(newNm.l.value, newNm.f.value);
      mount(el('div', {},
        el('header', {}, el('h1', {}, '⛳ ' + ev.name)),
        el('main', {},
          el('div', { class: 'card center' },
            el('h2', {}, '回答を受け付けました'),
            el('p', {}, `${who}さん：${S.attendance === 'join' ? '参加' : '欠席'}` +
              (ev.has_party && S.attendance === 'join' ? `／打上げ：${S.party === 'join' ? '参加' : '不参加'}` : '')),
            el('p', { class: 'muted' }, '内容を変えたいときは、もう一度回答すると上書きされます。'),
            el('button', { class: 'btn', onclick: () => renderForm(token) }, '回答を修正する')))));
    } finally {
      submit.disabled = false;
    }
  }));

  mount(el('div', {},
    el('header', {}, el('h1', {}, '⛳ ' + ev.name)),
    el('main', {},
      el('div', { class: 'card' },
        el('strong', {}, fmtDate(ev.event_date) + (ev.course_name ? ' ' + ev.course_name : '')),
        ev.form_deadline && el('div', { class: 'muted' }, '回答の締切：' + fmtDateTime(ev.form_deadline))),
      el('div', { class: 'card' },
        newNm.node,
        el('label', {}, '参加しますか？'), attWrap,
        partyBox,
        avgBox,
        el('label', {}, '備考（任意）'), note),
      submit)));
  drawAtt();
}

init();
</script>
</body>
